plugins {
    id 'com.android.application'
}

android {
    namespace 'de.universelab.chatarchiv'
    compileSdk 35

    defaultConfig {
        applicationId 'de.universelab.chatarchiv'
        minSdk 26
        targetSdk 35
        versionCode 15
        versionName '0.4.5'
    }

    buildTypes {
        // Preview APK is a separate app: never replace the user's private chat archive.
        debug {
            applicationIdSuffix '.researchqa'
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // The Android runtime provides org.json. JVM unit tests need its real implementation.
    testImplementation 'org.json:json:20240303'
}
