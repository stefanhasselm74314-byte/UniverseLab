plugins {
    id 'com.android.application'
}

android {
    namespace 'de.universelab.chatarchiv'
    compileSdk 35

    defaultConfig {
        applicationId 'de.universelab.chatarchiv'
        minSdk 26
        targetSdk 35
        versionCode 34
        versionName '0.5.18'
        manifestPlaceholders = [appTitle: 'UniverseLab ChatArchiv']
    }

    buildTypes {
        // Preview APK is a separate app: never replace the user's private chat archive.
        debug {
            // Unique QA package: never overwrite existing v0.5.12–v0.5.16 archives.
            applicationIdSuffix '.researchqa18'
            manifestPlaceholders = [appTitle: 'UniverseLab Forschung QA v0.5.18']
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation 'junit:junit:4.13.2'
    // The Android runtime provides org.json. JVM unit tests need its real implementation.
    testImplementation 'org.json:json:20240303'
}
