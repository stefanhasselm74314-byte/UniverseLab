name: HZT-M0-S6 C-PHYS-M1 Background-3C6 integrated control release

on:
  pull_request:
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseLedger_v0.1.md"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_synthetic_worker_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py"
      - ".github/workflows/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6_IntegratedControlRelease_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_synthetic_worker_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py"

permissions:
  contents: read

jobs:
  audit-integrated-control-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts and compile sources
        run: |
          python -m json.tool registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json >/dev/null
          python -m py_compile tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_synthetic_worker_v0.1.py
          python -m py_compile tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.1.py
          python -m py_compile tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py
          python -m py_compile tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py
          python -m py_compile tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py
      - name: Audit canonical release without subprocess execution
        run: python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py audit --json
      - name: Execute all four registered control transactions in temporary storage
        run: python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py self-test --json
      - name: Exercise canonical CLI atomic success path
        run: |
          root="$(mktemp -d)"
          control_id="HZT-M0-S6-C-PHYS-M1-BG3C6-CONTROL-CLI-SUCCESS"
          python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py control \
            --case analytic_success \
            --control-id "$control_id" \
            --output-root "$root" \
            --json
          python -m json.tool "$root/$control_id/result.json" >/dev/null
          python -m json.tool "$root/$control_id/artifact-manifest.json" >/dev/null
          grep -q '"final_classification":"CONTROL_TRANSACTION_PASS"' "$root/$control_id/result.json"
          grep -q '"physical_evidence_effect":"NONE"' "$root/$control_id/result.json"
          rm -rf "$root"
      - name: Run fail-closed validator and regression tests
        run: |
          python tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py --json
          python tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c6_v0.1.py
      - name: Prove physical run is denied before subprocess and artifacts
        run: |
          set +e
          python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c6_integrated_release_v0.2.py run \
            --run-id HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1 \
            --json > /tmp/bg3c6-physical-denial.json
          code=$?
          set -e
          test "$code" -eq 73
          grep -q '"status": "NOT_AUTHORIZED"' /tmp/bg3c6-physical-denial.json
          grep -q '"solver_calls": 0' /tmp/bg3c6-physical-denial.json
          grep -q '"result_artifact_created": false' /tmp/bg3c6-physical-denial.json
          test ! -e registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
      - name: Enforce evidence and authorization firewalls
        run: |
          grep -q '"physical_execution_authorized": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"cp01r1_execution_authorized": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"newton_allowed": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"shooting_root_allowed": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"R1.1": "BLOCKED"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C6IntegratedExecutionReleaseContract_v0.1.json
