name: HZT-M0-S6 C-PHYS-M1 Background-3C audit result

on:
  pull_request:
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationAuditResult_v0.1.json"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_AuditResult_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationAuditResult_v0.1.json"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_AuditResult_v0.1.yml"

permissions:
  contents: read

jobs:
  revalidate-recorded-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt
      - name: Validate recorded audit JSON
        run: python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationAuditResult_v0.1.json >/dev/null
      - name: Re-run implementation audit without Newton
        run: |
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py audit --json > /tmp/current-audit.json
          python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py --json
          python - <<'PY'
          import json
          from pathlib import Path
          recorded=json.loads(Path('registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationAuditResult_v0.1.json').read_text())
          current=json.loads(Path('/tmp/current-audit.json').read_text())
          assert recorded['status']=='PASS_PRIMARY_IMPLEMENTATION_AUDIT_NO_SOLVER_EXECUTION'
          assert current['status']==recorded['status']
          assert current['run_id']==recorded['run_id']
          assert current['run_payload_sha256']==recorded['run_payload_sha256']
          assert current['kernel_git_blob_sha']==recorded['canonical_kernel_git_blob_sha']
          assert current['node_count']==recorded['audit_measurements']['node_count']
          assert current['polynomial_degree']==recorded['audit_measurements']['polynomial_degree']
          assert current['state_and_residual_size']==recorded['audit_measurements']['state_and_residual_size']
          assert current['newton_call_count']==recorded['audit_measurements']['newton_call_count']==0
          assert current['authorization_status']==recorded['authorization_status']=='NOT_GRANTED'
          assert recorded['independent_backend_status']=='NOT_PRESENT_BLOCKING'
          assert recorded['firewall_tests']['solver_executed'] is False
          assert recorded['firewall_tests']['result_artifact_created'] is False
          assert recorded['gate_effect']['physical_evidence_effect']=='NONE'
          PY
      - name: Re-prove denied execution
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py run --json > /tmp/denied.json
          code=$?
          set -e
          test "$code" -eq 73
          grep -q '"solver_executed": false' /tmp/denied.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
