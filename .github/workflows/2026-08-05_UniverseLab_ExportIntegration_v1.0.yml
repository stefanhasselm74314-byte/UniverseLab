name: UniverseLab export integration v1.0

on:
  pull_request:
    branches: [main]
    paths:
      - "assets/2026-08-05_UniverseLab_Export_v1.0.css"
      - "assets/2026-08-05_UniverseLab_Export_v1.0.js"
      - "tools/2026-08-05_integrate_universelab_export_v1.0.py"
      - ".github/workflows/2026-08-05_UniverseLab_ExportIntegration_v1.0.yml"

permissions:
  contents: write

jobs:
  integrate-export-layer:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply idempotent integration
        run: python tools/2026-08-05_integrate_universelab_export_v1.0.py
      - name: Commit integrated pages when needed
        run: |
          if git diff --quiet; then
            echo "Export integration already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add guide.html tafelwerk.html research-status.html hyperlab.html
          git commit -m "Integrate shared export controls into public text pages"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
