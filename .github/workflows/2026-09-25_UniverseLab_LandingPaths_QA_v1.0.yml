name: UniverseLab landing paths QA v1.0

on:
  pull_request:
    paths:
      - 'index.html'
      - 'index-en.html'
      - 'assets/2026-09-25_UniverseLab_LandingPaths_v1.0.css'
      - 'assets/*LanguageSwitcher*'
      - 'assets/*MobileTypography*'
      - 'assets/*DesktopCompact*'
      - '2026-08-20_UniverseLab_MultilingualRouteRegistry_v1.1.json'
      - 'tests/2026-09-25_test_UniverseLab_LandingPaths_v1.0.py'
      - '.github/workflows/2026-09-25_UniverseLab_LandingPaths_QA_v1.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  landing-paths:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bind report to exact tested commit
        run: git rev-parse HEAD
      - name: Static navigation and scientific-copy guard
        run: python tests/2026-09-25_test_UniverseLab_LandingPaths_v1.0.py
      - name: Existing multilingual contract
        run: python tools/2026-08-20_UniverseLab_MultilingualSEOContract_v1.0.py
      - name: Install browser test tooling
        run: |
          python -m pip install 'playwright==1.57.0'
          python -m playwright install --with-deps chromium
      - name: HTTP browser matrix, keyboard and no-JavaScript navigation
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/web50-site
          ln -s "$GITHUB_WORKSPACE" /tmp/web50-site/UniverseLab
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/web50-site > /tmp/web50-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID"' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:4173/UniverseLab/index.html >/dev/null; then break; fi
            sleep 1
          done
          python tests/2026-09-25_test_UniverseLab_LandingPaths_v1.0.py --browser
      - name: Preserve evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web50-landing-paths-${{ github.event.pull_request.head.sha || github.sha }}
          path: web50-landing-report/
          if-no-files-found: error
