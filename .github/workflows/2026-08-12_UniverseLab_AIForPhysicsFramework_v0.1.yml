name: UniverseLab AI-for-Physics framework v0.1

on:
  pull_request:
    paths:
      - science/ai-for-physics/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.md
      - registry/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.json
      - tools/2026-08-12_validate_ul_aip_framework_v0.1.py
      - tests/2026-08-12_test_ul_aip_framework_v0.1.py
      - .github/workflows/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.yml
  push:
    branches: [main]
    paths:
      - science/ai-for-physics/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.md
      - registry/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.json
      - tools/2026-08-12_validate_ul_aip_framework_v0.1.py
      - tests/2026-08-12_test_ul_aip_framework_v0.1.py
      - .github/workflows/2026-08-12_UniverseLab_AIForPhysicsFramework_v0.1.yml

permissions:
  contents: read

jobs:
  validate-ul-aip:
    name: methods-only framework and governance firewall
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile validator and regression test
        run: |
          python -m py_compile \
            tools/2026-08-12_validate_ul_aip_framework_v0.1.py \
            tests/2026-08-12_test_ul_aip_framework_v0.1.py

      - name: Validate registry, framework and firewalls
        run: python tools/2026-08-12_validate_ul_aip_framework_v0.1.py

      - name: Run regression checks
        run: python tests/2026-08-12_test_ul_aip_framework_v0.1.py
