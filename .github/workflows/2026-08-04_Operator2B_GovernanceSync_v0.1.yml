name: Operator-2B governance synchronization

on:
  push:
    branches:
      - "agent/operator-2b-governance-sync-v0-1"
    paths:
      - "tools/2026-08-04_apply_operator_2b_governance_sync_v0.1.py"
      - ".github/workflows/2026-08-04_Operator2B_GovernanceSync_v0.1.yml"
      - "project-manifest.json"
      - "registry/session-checkpoint-latest.json"
      - "registry/decision-log.jsonl"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/operator-2b-governance-sync-v0-1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply narrow governance migration
        run: python tools/2026-08-04_apply_operator_2b_governance_sync_v0.1.py --apply

      - name: Validate synchronized G0 state
        run: |
          python tools/2026-08-04_apply_operator_2b_governance_sync_v0.1.py --check
          python tools/2026-08-04_validate_g0_three_track_sync_v1.6.py --json
          python tests/2026-08-04_test_g0_three_track_sync_v1.6.py

      - name: Commit synchronized pointers
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "No synchronization commit required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add project-manifest.json registry/session-checkpoint-latest.json registry/decision-log.jsonl
          git commit -m "Synchronize Operator-2B governance pointers"
          git push origin HEAD:agent/operator-2b-governance-sync-v0-1
