name: Temporary Tafelwerk ZIP export bundle patch

on:
  push:
    branches: [ui-tafelwerk-export-zip-bundle]
    paths:
      - 'tools/2026-08-12_patch_tafelwerk_zip_export_bundle_v1.0.py'
      - '.github/workflows/2026-08-12_Temporary_TafelwerkZipExportBundlePatch_v1.0.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ui-tafelwerk-export-zip-bundle
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch Tafelwerk ZIP bundle export
        run: python tools/2026-08-12_patch_tafelwerk_zip_export_bundle_v1.0.py
      - name: Validate JavaScript syntax
        run: node --check assets/2026-08-12_UniverseLab_TafelwerkAllFormulaExport_v1.0.js
      - name: Commit patched exporter if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- assets/2026-08-12_UniverseLab_TafelwerkAllFormulaExport_v1.0.js; then
            echo 'No exporter patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/2026-08-12_UniverseLab_TafelwerkAllFormulaExport_v1.0.js
          git commit -m 'Tafelwerk: add ZIP complete export bundle'
          git push origin HEAD:ui-tafelwerk-export-zip-bundle
