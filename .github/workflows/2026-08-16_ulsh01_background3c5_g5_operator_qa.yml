name: ULSH-01 Background3C5 G5 operator v0.3 QA

on:
  pull_request:
    paths:
      - 'ulsh/ULSH-01/C-PHYS/**'
      - '.github/workflows/2026-08-16_ulsh01_background3c5_g5_operator_qa.yml'
  workflow_dispatch:

jobs:
  g5-operator-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check numpy
      - name: Compile
        run: python -m py_compile ulsh/ULSH-01/C-PHYS/2026-08-16_hzt_background3c5_full_operator_candidate_v0.3.py ulsh/ULSH-01/C-PHYS/2026-08-16_test_hzt_background3c5_full_operator_candidate_v0.3.py
      - name: G5 algebraic regression
        run: python ulsh/ULSH-01/C-PHYS/2026-08-16_test_hzt_background3c5_full_operator_candidate_v0.3.py
      - name: Governance firewall
        run: |
          python - <<'PY'
          import importlib.util, pathlib, sys
          p=pathlib.Path('ulsh/ULSH-01/C-PHYS/2026-08-16_hzt_background3c5_full_operator_candidate_v0.3.py')
          s=importlib.util.spec_from_file_location('g5',p); m=importlib.util.module_from_spec(s); sys.modules[s.name]=m; s.loader.exec_module(m)
          g=m.governance()
          assert g['physical_execution_authorized'] is False
          assert g['rank_R_claim_allowed'] is False
          assert g['evidence_effect']=='NONE_IMPLEMENTATION_ONLY'
          assert g['Gamma_Sigma']=='m_layer*q_hat'
          assert g['Gamma_Sigma_status']=='PROVENANCE_CLOSED_CANONICAL_M1'
          PY
