jobs:
  wp1c4b2a-boundary-second-variation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WP1C4B2A standalone validator
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B2A_BoundarySecondVariationMaster_v0.1.py
      - name: Re-run WP1C4B1D direct first-shape assembly
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B1D_DirectMovingActionShape_v0.1.py
      - name: Re-run WP1C4B1C passive constraint
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B1C_PassiveShapeConstraint_v0.1.py
      - name: Re-run WP1C4B0 second-order path contract
        run: python tests/2026-09-07_test_UniverseLab_ULSH05_WP1C4B0_SecondOrderEmbeddingPathContract_v0.1.py
      - name: Re-run WP1C2 fixed-interface cap Hessian
        run: python tests/2026-09-07_test_UniverseLab_ULSH05_WP1C2_FixedInterfaceCapHessian_v0.1.py
      - name: Re-run WP1B EH+GHY Hessian master
        run: python tests/2026-09-07_test_UniverseLab_ULSH05_WP1B_EHGHYHessianMaster_v0.1.py
      - name: Validate declared dependency closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          d=json.loads((root/'registry/2026-09-08_UniverseLab_ULSH05_WP1C4B2A_BoundarySecondVariationMaster_v0.1.json').read_text())
          deps=d['dependencies']
          assert len(deps)==len(set(deps))==8
          for rel in deps:
              assert (root/rel).is_file(), rel
          print('WP1C4B2A dependency closure: PASS')
          PY
      - name: Fail closed on component-Hessian or physical promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('registry/2026-09-08_UniverseLab_ULSH05_WP1C4B2A_BoundarySecondVariationMaster_v0.1.json').read_text())
          g=d['gate_state']
          assert d['physical_gate_effect']=='NONE'
          assert d['physical_evidence_effect']=='NONE'
          assert d['solver_authorized'] is False
          assert g['WP1_first_shape_level']=='CLOSED_ANALYTICALLY_AS_REDUNDANT_CONSTRAINT_CHANNEL'
          assert g['WP1_boundary_second_variation_chain_rule']=='DERIVED'
          assert g['WP1_intrinsic_cap_moving_second_variation']=='DERIVED_CHAIN_RULE_MASTER'
          assert g['WP1_moving_GHY_second_variation']=='DERIVED_SHAPE_CONTROL_AND_RESIDUAL_CHAIN_RULE_MASTER'
          assert g['WP1_boundary_residual_linearizations']=='PARTIAL_NOT_FULLY_COMPONENTIZED'
          assert g['WP1_full_boundary_hessian']=='NOT_CLOSED_COMPONENT_OPERATOR_AND_SYMMETRY_TEST_OPEN'
          assert g['WP1_full_quadratic_action']=='NOT_CLOSED'
          assert g['PERTURBED_JUNCTION_SYSTEM']=='NOT_RELEASED'
          assert g['PHYSICAL_BACKGROUND']=='NOT_ESTABLISHED'
          assert g['FM-G0']=='OPEN'
          assert g['AuthorizationDecision']=='NOT_CREATED'
          assert g['SingleUseGrant']=='NOT_CREATED'
          assert g['BACKEND_IMPORT']=='NOT_EXECUTED'
          assert g['SOLVER_EXECUTION']=='NOT_EXECUTED'
          assert g['PHYSICAL_RESPONSE_RANK']=='NOT_EXECUTED'
          assert g['K1-D']=='NOT_RELEASED'
          assert g['K1-E']=='NOT_ADMISSIBLE'
          print('WP1C4B2A firewalls: PASS')
          PY
