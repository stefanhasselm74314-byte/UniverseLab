name: HZT-M0-S6 C-PHYS-M1 Background-3C primary implementation

on:
  pull_request:
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResultSchema_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResourcePolicy_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationLedger_v0.1.md"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.1.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.2.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.1.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_PrimaryImplementation_v0.2.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResultSchema_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResourcePolicy_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CPrimaryImplementationLedger_v0.1.md"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.1.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.2.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.1.py"
      - "tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_PrimaryImplementation_v0.2.yml"

permissions:
  contents: read

jobs:
  audit-primary-implementation-no-execution:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen audit dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt

      - name: Validate machine-readable contracts
        run: |
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResultSchema_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CResourcePolicy_v0.1.json >/dev/null

      - name: Compile implementation, gate, validator and tests
        run: |
          python -m py_compile tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.1.py
          python -m py_compile tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.2.py
          python -m py_compile tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.1.py
          python -m py_compile tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py
          python -m py_compile tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py

      - name: Run canonical primary implementation audit
        run: |
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py audit --json
          python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py --json

      - name: Run fail-closed regression tests
        run: python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c_v0.2.py

      - name: Prove run command and direct kernel invocation are denied
        shell: bash
        run: |
          set -euo pipefail
          set +e
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_gate_v0.2.py run --json > /tmp/bg3c-run-denied.json
          gate_code=$?
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.2.py > /tmp/bg3c-kernel-denied.txt
          kernel_code=$?
          set -e
          test "$gate_code" -eq 73
          test "$kernel_code" -eq 73
          grep -q '"status": "NOT_AUTHORIZED"' /tmp/bg3c-run-denied.json
          grep -q '"solver_executed": false' /tmp/bg3c-run-denied.json
          grep -q 'NOT_AUTHORIZED' /tmp/bg3c-kernel-denied.txt

      - name: Enforce authorization, output and evidence firewalls
        shell: bash
        run: |
          set -euo pipefail
          test ! -e registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
          grep -q '"status": "NOT_GRANTED"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.1.json
          grep -q '"authorized": false' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.1.json
          grep -q '"BACKGROUND_3C_INDEPENDENT_BACKEND": "NOT_PRESENT"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
          grep -q '"BACKGROUND_3C_EXECUTION": "NOT_AUTHORIZED"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CImplementationContract_v0.2.json
