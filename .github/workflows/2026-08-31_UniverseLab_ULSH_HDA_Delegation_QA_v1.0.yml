name: UniverseLab ULSH HDA Delegation QA v1.0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  ulsh-hda-delegation:
    name: ULSH HDA delegation fail-closed QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate governed ULSH HDA delegation
        run: python tools/2026-08-31_validate_universelab_ulsh_hda_delegation_v1.0.py
