name: ULSH-01 Background3C5 G3.6 Jacobian preflight v0.1

on:
  pull_request:
    paths:
      - 'ulsh/ULSH-01/C-PHYS/2026-08-17_Background3C5_G3_6_Augmented_Boundary_Operator_Jacobian_Preflight_v0.1.md'
      - 'ulsh/ULSH-01/C-PHYS/2026-08-17_Background3C5_G3_6_Augmented_Boundary_Operator_Jacobian_Preflight_v0.1.json'
      - 'ulsh/ULSH-01/C-PHYS/2026-08-17_test_Background3C5_G3_6_Jacobian_Schur_Preflight_v0.1.py'
      - '.github/workflows/2026-08-17_ULSH01_Background3C5_G3_6_Jacobian_Preflight_v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  algebraic-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install QA dependency only
        run: python -m pip install --disable-pip-version-check numpy
      - name: Run G3.6 algebraic QA
        run: python ulsh/ULSH-01/C-PHYS/2026-08-17_test_Background3C5_G3_6_Jacobian_Schur_Preflight_v0.1.py
