name: Sternfenster 0.2 unsigned build
on:
  push:
    branches: ['fix/sternfenster-native-sky-v0.2']
    paths:
      - 'sky-widget/**'
      - '.github/workflows/2026-11-21_sternfenster_native_v020_build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Compile without private signing credentials
        working-directory: sky-widget
        run: python3 tools/build_local.py --sdk "$ANDROID_HOME"
      - uses: actions/upload-artifact@v4
        with:
          name: Sternfenster-0.2.0-UNSIGNED-build-check
          path: sky-widget/build-manual/Sternfenster_Android_v0.2.0-UNSIGNED.apk
          if-no-files-found: error
