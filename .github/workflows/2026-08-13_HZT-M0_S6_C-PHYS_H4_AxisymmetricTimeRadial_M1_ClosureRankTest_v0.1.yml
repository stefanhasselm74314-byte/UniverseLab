name: HZT-M0 S6 C-PHYS H4 Axisymmetric Time-Radial M1 Closure v0.1

on:
  pull_request:
    paths:
      - "registry/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.md"
      - "tools/2026-08-13_validate_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py"
      - "tests/2026-08-13_test_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py"
      - ".github/workflows/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.md"
      - "tools/2026-08-13_validate_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py"
      - "tests/2026-08-13_test_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py"
      - ".github/workflows/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-h4-time-radial-closure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: python -m json.tool registry/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.json >/dev/null
      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-08-13_validate_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py
          python -m py_compile tests/2026-08-13_test_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py
      - name: Run H4 algebraic regression suite
        run: python tests/2026-08-13_test_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py
      - name: Validate H4 source bindings and governance
        run: python tools/2026-08-13_validate_hzt_m0_s6_c_phys_h4_axisymmetric_time_radial_m1_closure_v0.1.py --json
      - name: Enforce scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          F=registry/2026-08-13_HZT-M0_S6_C-PHYS_H4_AxisymmetricTimeRadial_M1_ClosureRankTest_v0.1.json
          grep -q '"gemini_blocks": "EXTERNAL_UNVERIFIED_GEMINI_DRAFT"' "$F"
          grep -q '"ambient_signature": "(-,+,+,+,+,+)"' "$F"
          grep -q '"result": "STRUCTURALLY_SQUARE_MODULO_2D_DIFFEO_GAUGE"' "$F"
          grep -q '"gravitational_matrix_determinant": "12\*a\^7\*L"' "$F" || grep -q '"gravitational_matrix_determinant": "12*a^7*L"' "$F"
          grep -q '"D2NQ_parent_dynamic_selection": "OPEN_NOT_EXECUTED"' "$F"
          grep -q '"K1-D": "NOT_RELEASED"' "$F"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$F"
          grep -q '"WP4": "BLOCKED"' "$F"
          grep -q '"physical_evidence_effect": "NONE"' "$F"
