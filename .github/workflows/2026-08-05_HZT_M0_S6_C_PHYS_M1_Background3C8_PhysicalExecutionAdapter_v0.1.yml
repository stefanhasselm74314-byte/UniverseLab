name: HZT-M0-S6 C-PHYS-M1 Background-3C8 physical adapter controls

on:
  pull_request:
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json"
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterLedger_v0.1.md"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_manufactured_backend_worker_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py"
      - ".github/workflows/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8_PhysicalExecutionAdapter_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json"
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_manufactured_backend_worker_v0.1.py"
      - "tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py"
      - ".github/workflows/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8_PhysicalExecutionAdapter_v0.1.yml"

permissions:
  contents: read

jobs:
  audit-physical-adapter-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      NUMEXPR_NUM_THREADS: "1"
      VECLIB_MAXIMUM_THREADS: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate contracts results and compile sources
        run: |
          python -m json.tool registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json >/dev/null
          python -m py_compile tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_manufactured_backend_worker_v0.1.py
          python -m py_compile tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py
          python -m py_compile tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py
          python -m py_compile tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py
      - name: Audit source-bound adapter without backend import
        run: python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py audit --json
      - name: Execute manufactured end-to-end adapter controls
        run: python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py self-test --json
      - name: Exercise canonical CLI atomic control path
        run: |
          root="$(mktemp -d)"
          control_id="HZT-M0-S6-C-PHYS-M1-BG3C8-CONTROL-CLI-SUCCESS"
          python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py control \
            --case manufactured_success \
            --control-id "$control_id" \
            --output-root "$root" \
            --json
          python -m json.tool "$root/$control_id/result.json" >/dev/null
          python -m json.tool "$root/$control_id/artifact-manifest.json" >/dev/null
          grep -q '"final_classification":"CONTROL_ADAPTER_TRANSACTION_PASS"' "$root/$control_id/result.json"
          grep -q '"result_schema_preview_is_physical_result":false' "$root/$control_id/result.json"
          grep -q '"physical_backend_imported":false' "$root/$control_id/result.json"
          grep -q '"physical_solver_calls":0' "$root/$control_id/result.json"
          rm -rf "$root"
      - name: Revalidate frozen audit result and regression tests
        run: |
          python tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py --json
          python tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c8_v0.1.py
      - name: Prove physical run is denied before backend import and artifacts
        run: |
          set +e
          python tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c8_physical_execution_adapter_v0.1.py run \
            --run-id HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1 \
            --json > /tmp/bg3c8-physical-denial.json
          code=$?
          set -e
          test "$code" -eq 73
          grep -q '"status": "NOT_AUTHORIZED"' /tmp/bg3c8-physical-denial.json
          grep -q '"physical_backend_imported": false' /tmp/bg3c8-physical-denial.json
          grep -q '"solver_calls": 0' /tmp/bg3c8-physical-denial.json
          grep -q '"cp01r1_attempted": false' /tmp/bg3c8-physical-denial.json
          grep -q '"result_artifact_created": false' /tmp/bg3c8-physical-denial.json
          test ! -e registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
      - name: Enforce immutable governance firewalls
        run: |
          grep -q '"physical_execution_authorized": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json
          grep -q '"cp01r1_execution_authorized": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json
          grep -q '"operative_grant_creation_allowed": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json
          grep -q '"real_backend_dynamic_import": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterContract_v0.1.json
          grep -q '"package_manifest_sha256": "497d6da51d0d7f436ae7cf24d8c4acad93d5e2423ab9eb717ec016c776e27613"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
          grep -q '"schedule_sha256": "95001986dc93818f0fea3124cf9ddcd63eb136f8d206f6200a4e8c0cf6d54927"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
          grep -q '"R1.1": "BLOCKED"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C8PhysicalExecutionAdapterAuditResult_v0.1.json
