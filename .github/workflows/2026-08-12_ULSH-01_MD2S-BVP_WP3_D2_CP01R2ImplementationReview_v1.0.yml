name: ULSH-01 WP3-D2 CP01R2 implementation review no-execution

on:
  pull_request:
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_*.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2ImplementationReview_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_*.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_*.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2ImplementationReview_v1.0.yml'

permissions:
  contents: read

jobs:
  implementation-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate D2 JSON
        run: |
          python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2ImplementationContract_v1.0.json >/dev/null
          python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2IndependentProtocolReview_v1.0.json >/dev/null

      - name: Compile D2 implementation and review tools
        run: |
          python -m py_compile tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py
          python -m py_compile tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_independent_protocol_review_v1.0.py
          python -m py_compile tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2ImplementationReviewTest_v1.0.py

      - name: Run implementation audit
        run: python tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py

      - name: Run independent protocol review
        run: python tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_independent_protocol_review_v1.0.py

      - name: Run D2 regression tests
        run: python tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D2_CP01R2ImplementationReviewTest_v1.0.py

      - name: Hard no-execution and no-authorization firewall
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(find registry -maxdepth 1 -type f \( -name '*CP01R2*ReleaseAuthorization*.json' -o -name '*CP01R2*ExecutionGrant*.json' \) -print -quit)"
          ! grep -q 'background_3c_primary_kernel' tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py
          ! grep -q 'scipy.optimize' tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py
          grep -q 'raise PhysicalExecutionDenied' tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py
          grep -q 'physical_solve_authorized.*False' tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d2_cp01r2_etrn_v1.0.py
