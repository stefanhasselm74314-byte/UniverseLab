name: HZT-M0 S6 C-PHYS H4R1 Dimensionless IBVP Constraint Boundary Rank v0.1

on:
  pull_request:
    branches: [main]
    paths:
      - "registry/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.md"
      - "tools/2026-08-14_validate_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py"
      - "tests/2026-08-14_test_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py"
      - ".github/workflows/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.md"
      - "tools/2026-08-14_validate_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py"
      - "tests/2026-08-14_test_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py"
      - ".github/workflows/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-h4r1-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry JSON
        run: python -m json.tool registry/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.json >/dev/null
      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-08-14_validate_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py
          python -m py_compile tests/2026-08-14_test_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py
      - name: Run algebraic H4R1 preflight tests
        run: python tests/2026-08-14_test_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py
      - name: Validate source bindings and governance
        run: python tools/2026-08-14_validate_hzt_m0_s6_c_phys_h4r1_dimensionless_ibvp_v0.1.py --json
      - name: Enforce scientific firewall
        shell: bash
        run: |
          set -euo pipefail
          F=registry/2026-08-14_HZT-M0_S6_C-PHYS_H4R1_DimensionlessIBVP_ConstraintBoundaryRank_v0.1.json
          grep -q '"gemini_blocks": "EXTERNAL_UNVERIFIED_GEMINI_DRAFT"' "$F"
          grep -q '"physical_parent_solve_authorized": false' "$F"
          grep -q '"full_two_sided_complementing_condition": "OPEN"' "$F"
          grep -q '"K1-D": "NOT_RELEASED"' "$F"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$F"
          grep -q '"WP4": "BLOCKED"' "$F"
          grep -q '"physical_evidence_effect": "NONE"' "$F"
