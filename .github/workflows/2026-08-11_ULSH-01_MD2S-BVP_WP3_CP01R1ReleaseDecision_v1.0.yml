name: ULSH-01 WP3 CP01R1 release decision no-solve

on:
  pull_request:
    paths:
      - 'registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json'
      - 'tools/2026-08-11_ulsh_01_md2s_bvp_wp3_release_decision_v1.0.py'
      - 'tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionLedger_v1.0.md'
      - '.github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json'
      - 'tools/2026-08-11_ulsh_01_md2s_bvp_wp3_release_decision_v1.0.py'
      - 'tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionLedger_v1.0.md'
      - '.github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.yml'

permissions:
  contents: read

jobs:
  wp3-release-decision-no-solve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile auditor and tests
        run: |
          python -m py_compile tools/2026-08-11_ulsh_01_md2s_bvp_wp3_release_decision_v1.0.py
          python -m py_compile tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionTest_v1.0.py
      - name: Validate decision JSON
        run: python -m json.tool registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json >/dev/null
      - name: Reproduce release decision
        run: python tools/2026-08-11_ulsh_01_md2s_bvp_wp3_release_decision_v1.0.py >/tmp/ulsh_wp3_release_decision.json
      - name: Run decision regressions
        run: python tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecisionTest_v1.0.py
      - name: Hard no-issuance and no-solve firewall
        shell: bash
        run: |
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_PhysicalSolveReleaseAuthorization_v1.3.json
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.3.json
          ! grep -R --line-number --fixed-strings 'physical_solve_authorized": true' registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json
          ! grep -R --line-number --fixed-strings 'physical_solve_executed": true' registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json
          ! grep -R --line-number --fixed-strings 'physical_evidence_effect": "POSITIVE"' registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ReleaseDecision_v1.0.json
