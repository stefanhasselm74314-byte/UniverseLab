name: UniverseLab current-main canonical state reconciliation QA

on:
  pull_request:
    paths:
      - 'project-manifest.json'
      - 'research-status.html'
      - 'research-status-en.html'
      - 'assets/2026-08-16_UniverseLab_GlobalShell_v1.1.js'
      - 'registry/*UniverseLab_CurrentMainCanonicalState*.json'
      - 'registry/*UniverseLab_SiteState*.json'
      - 'registry/*UniverseLab_SessionCheckpoint*.json'
      - 'registry/session-checkpoint-latest.json'
      - 'schemas/*UniverseLab_SiteStateSchema*.json'
      - 'governance/*UniverseLab_CurrentMainCanonicalStateReconciliation*.md'
      - 'tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py'
      - 'tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py'
      - '.github/workflows/2026-09-01_UniverseLab_CurrentMainCanonicalStateReconciliation_QA_v1.0.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-current-main-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile pointer-aware validator and tests
        run: |
          python -m py_compile tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py
          python -m py_compile tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py

      - name: Parse the active state chain declared by the latest checkpoint
        run: |
          python - <<'PY'
          import json
          from pathlib import Path, PurePosixPath

          root=Path('.')
          alias_path=root/'registry/session-checkpoint-latest.json'
          alias=json.loads(alias_path.read_text())
          assert alias['schema']=='universelab.session-checkpoint.v1'
          for field in ('canonical_snapshot','canonical_state','site_state'):
              value=alias[field]
              path=PurePosixPath(value)
              assert not path.is_absolute() and '..' not in path.parts, (field,value)
              target=root/path
              assert target.is_file(), (field,value)
              json.loads(target.read_text())
          json.loads((root/'project-manifest.json').read_text())
          checkpoint=root/alias['canonical_snapshot']
          assert alias_path.read_bytes()==checkpoint.read_bytes()
          print('Active current-main pointer chain: PASS')
          PY

      - name: Run fail-closed reconciliation validator
        run: python tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py --strict-source-existence

      - name: Run adversarial pointer and firewall regressions
        run: python tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py
