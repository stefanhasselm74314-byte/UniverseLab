name: UniverseLab current-main canonical state reconciliation QA

on:
  pull_request:
    paths:
      - 'project-manifest.json'
      - 'research-status.html'
      - 'assets/2026-08-16_UniverseLab_GlobalShell_v1.1.js'
      - 'registry/2026-09-01_UniverseLab_CurrentMainCanonicalState_v1.0.json'
      - 'registry/2026-09-01_UniverseLab_SiteState_v1.1.json'
      - 'registry/2026-09-01_UniverseLab_SessionCheckpoint_v1.31.json'
      - 'registry/session-checkpoint-latest.json'
      - 'schemas/2026-09-01_UniverseLab_SiteStateSchema_v1.1.json'
      - 'governance/2026-09-01_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.md'
      - 'tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py'
      - 'tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py'
      - '.github/workflows/2026-09-01_UniverseLab_CurrentMainCanonicalStateReconciliation_QA_v1.0.yml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-current-main-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py
          python -m py_compile tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py
      - name: Parse canonical JSON artifacts
        run: |
          python -m json.tool registry/2026-09-01_UniverseLab_CurrentMainCanonicalState_v1.0.json >/dev/null
          python -m json.tool registry/2026-09-01_UniverseLab_SiteState_v1.1.json >/dev/null
          python -m json.tool schemas/2026-09-01_UniverseLab_SiteStateSchema_v1.1.json >/dev/null
          python -m json.tool registry/2026-09-01_UniverseLab_SessionCheckpoint_v1.31.json >/dev/null
          python -m json.tool registry/session-checkpoint-latest.json >/dev/null
          python -m json.tool project-manifest.json >/dev/null
      - name: Run fail-closed reconciliation validator
        run: python tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py --strict-source-existence
      - name: Run adversarial regression tests
        run: python tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py
