name: UniverseLab split-pane v1.0

on:
  pull_request:
    paths:
      - "assets/2026-08-05_UniverseLab_SplitPane_v1.0.css"
      - "assets/2026-08-05_UniverseLab_SplitPane_v1.0.js"
      - "observatory.html"
      - "tafelwerk.html"
      - "tests/2026-08-05_UniverseLab_SplitPane_v1.0.py"
      - ".github/workflows/2026-08-05_UniverseLab_SplitPane_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "assets/2026-08-05_UniverseLab_SplitPane_v1.0.css"
      - "assets/2026-08-05_UniverseLab_SplitPane_v1.0.js"
      - "observatory.html"
      - "tafelwerk.html"
      - "tests/2026-08-05_UniverseLab_SplitPane_v1.0.py"
      - ".github/workflows/2026-08-05_UniverseLab_SplitPane_v1.0.yml"

permissions:
  contents: read

jobs:
  validate-split-pane:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript syntax
        run: node --check assets/2026-08-05_UniverseLab_SplitPane_v1.0.js
      - name: Validate split-pane, mobile fallback and page continuity
        run: python tests/2026-08-05_UniverseLab_SplitPane_v1.0.py
      - name: Re-run idempotent integration without changes
        run: |
          python tools/2026-08-05_integrate_universelab_split_pane_v1.0.py
          git diff --exit-code -- observatory.html tafelwerk.html
      - name: Confirm no scientific data or model files changed
        run: |
          git diff --name-only "${{ github.event.pull_request.base.sha }}"...HEAD | tee /tmp/split-files.txt
          test "$(grep -Ec '\.(json|csv|ipynb)$' /tmp/split-files.txt || true)" -eq 0
