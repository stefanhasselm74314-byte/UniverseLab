name: ULSH-01 WP3-D12 CP01R3 manufactured controls v1.0

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/2026-08-13_ulsh_01_md2s_bvp_wp3_d12_cp01r3_bjp01_etrn02_v1.0.py"
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3SeedSpec_v1.0.json"
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json"
      - "science/hzt-m0/md2s/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAuditLedger_v1.0.md"
      - "tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlsTest_v1.0.py"
      - ".github/workflows/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControls_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "tools/2026-08-13_ulsh_01_md2s_bvp_wp3_d12_cp01r3_bjp01_etrn02_v1.0.py"
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3SeedSpec_v1.0.json"
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json"
      - "science/hzt-m0/md2s/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAuditLedger_v1.0.md"
      - "tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlsTest_v1.0.py"
      - ".github/workflows/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControls_v1.0.yml"

permissions:
  contents: read

jobs:
  manufactured-controls-only:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen numerical dependency for manufactured controls
        run: python -m pip install --disable-pip-version-check 'numpy==2.1.3'
      - name: Validate frozen JSON records
        run: |
          python -m json.tool registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3SeedSpec_v1.0.json >/dev/null
          python -m json.tool registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json >/dev/null
      - name: Compile manufactured-only implementation and audit-bound test
        run: |
          python -m py_compile tools/2026-08-13_ulsh_01_md2s_bvp_wp3_d12_cp01r3_bjp01_etrn02_v1.0.py
          python -m py_compile tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlsTest_v1.0.py
      - name: Reproduce six manufactured controls and physical exit-73 firewall
        run: python tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlsTest_v1.0.py
      - name: Emit deterministic current control audit
        run: python tools/2026-08-13_ulsh_01_md2s_bvp_wp3_d12_cp01r3_bjp01_etrn02_v1.0.py --audit | tee /tmp/cp01r3-d12-audit.json
      - name: Enforce physical-backend isolation and governance
        run: |
          ! grep -nE 'background_3c_primary_kernel|background_3c_independent_backend|CP01R2ImmediateExecution|single.use.grant' tools/2026-08-13_ulsh_01_md2s_bvp_wp3_d12_cp01r3_bjp01_etrn02_v1.0.py
          grep -q '"physical_backend_imported": false' /tmp/cp01r3-d12-audit.json
          grep -q '"physical_solver_calls": 0' /tmp/cp01r3-d12-audit.json
          grep -q '"physical_evidence_effect": "NONE"' /tmp/cp01r3-d12-audit.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json
          grep -q 'ULSH-01_WP3_D13_CP01R3_INDEPENDENT_IMPLEMENTATION_REVIEW_NO_PHYSICAL_EXECUTION' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D12_CP01R3ManufacturedControlAudit_v1.0.json
