name: ULSH-01 WP3-D9 CP01R2 post-execution result review v1.0

on:
  pull_request:
    branches: [main]
    paths:
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json"
      - "science/hzt-m0/md2s/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultLedger_v1.0.md"
      - "tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReviewTest_v1.0.py"
      - ".github/workflows/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json"
      - "science/hzt-m0/md2s/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultLedger_v1.0.md"
      - "tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReviewTest_v1.0.py"
      - ".github/workflows/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.yml"

permissions:
  contents: read

jobs:
  review-no-rerun:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate registry JSON
        run: python -m json.tool registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json >/dev/null
      - name: Compile and run fail-closed result review test
        run: |
          python -m py_compile tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReviewTest_v1.0.py
          python tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReviewTest_v1.0.py
      - name: Enforce review-only scope
        run: |
          ! grep -R -nE -- '--execute|subprocess|scipy|numpy|damped_newton|shooting_residual|solve_ivp|root\(' \
            registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json \
            science/hzt-m0/md2s/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultLedger_v1.0.md \
            tests/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReviewTest_v1.0.py
      - name: Confirm governance firewalls
        run: |
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json
          grep -q 'DO_NOT_RERUN_OR_REPLAY_THE_SPENT_CP01R2_D8_GRANT' registry/2026-08-13_ULSH-01_MD2S-BVP_WP3_D9_CP01R2ResultReview_v1.0.json
