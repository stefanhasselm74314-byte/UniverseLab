name: ULSH-01 WP2 owner-ratification bridge QA v0.2

on:
  pull_request:
    paths:
      - 'registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.json'
      - 'registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.md'
      - 'tools/2026-09-23_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py'
      - 'tests/2026-09-23_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py'
      - 'tools/2026-09-02_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py'
      - 'tests/2026-09-02_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py'
      - '.github/workflows/2026-09-23_ULSH01_WP2_OwnerRatificationBridge_QA_v0.2.yml'
  push:
    branches: [main]
    paths:
      - 'registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.json'
      - 'registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.md'
      - 'tools/2026-09-23_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py'
      - 'tests/2026-09-23_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py'
      - 'tools/2026-09-02_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py'
      - 'tests/2026-09-02_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py'
      - '.github/workflows/2026-09-23_ULSH01_WP2_OwnerRatificationBridge_QA_v0.2.yml'

permissions:
  contents: read

jobs:
  owner-ratification-bridge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout provenance
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse machine-readable authority contracts
        run: |
          python -m json.tool registry/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.json >/dev/null
          python -m json.tool registry/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityTrustRootCandidate_v0.1.json >/dev/null

      - name: Compile verifier and adversarial tests
        run: |
          python -m py_compile tools/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityVerificationCore_v0.1.py
          python -m py_compile tools/2026-09-02_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py
          python -m py_compile tests/2026-09-02_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py
          python -m py_compile tools/2026-09-23_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py
          python -m py_compile tests/2026-09-23_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py

      - name: Run legacy nonoperative and v0.2 fail-closed QA
        run: |
          python tests/2026-09-02_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py
          python tests/2026-09-23_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py

      - name: Enforce verification-only implementation
        shell: bash
        run: |
          set -euo pipefail
          files=(
            registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.json
            registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.md
            tools/2026-09-23_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py
            tests/2026-09-23_test_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py
          )
          if grep -En -- 'BEGIN (OPENSSH |EC |RSA )?PRIVATE KEY|PRIVATE KEY-----' "${files[@]}"; then
            echo 'Private key material was found.' >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          text='\n'.join(Path(p).read_text() for p in [
              'tools/2026-09-02_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.1.py',
              'tools/2026-09-23_verify_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityAttestation_v0.2.py',
              'tools/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityVerificationCore_v0.1.py',
          ])
          forbidden=['private_bytes(', 'Ed25519PrivateKey', '.sign(', 'import scipy', 'import numpy']
          found=[token for token in forbidden if token in text]
          assert not found, found
          print('Verification-only implementation: PASS')
          PY

      - name: Enforce versioned bridge and physical firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          v1=json.loads(Path('registry/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.1.json').read_text())
          v2=json.loads(Path('registry/2026-09-23_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthoritySignatureProvenanceContract_v0.2.json').read_text())
          root=json.loads(Path('registry/2026-09-02_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorityTrustRootCandidate_v0.1.json').read_text())
          assert v1['status']=='DRAFT_NOT_RATIFIED'
          assert v2['status']=='DRAFT_NOT_RATIFIED'
          assert v2['contract_id']=='ULSH01-WP2-AUTHORITY-SIGNATURE-PROVENANCE-v0.2'
          assert v2['signed_envelope_contract_id']=='ULSH01-WP2-AUTHORITY-SIGNATURE-PROVENANCE-v0.1'
          assert v2['supersedes']['operational_activation']=='SUPERSEDED_NO_FUTURE_OPERATIONAL_ACTIVATION'
          bridge=v2['owner_ratification_bridge']
          assert bridge['positive_operational_verification_available_in_this_revision'] is False
          assert bridge['independently_verifiable_owner_ratification_schema']=='NOT_IMPLEMENTED'
          assert bridge['missing_invalid_ambiguous_or_unverifiable_result']=='OWNER_RATIFICATION_NOT_VERIFIABLE'
          assert v2['verifier_contract']['positive_operational_result_available_in_this_revision'] is False
          assert v2['current_gate_state']['operative_authorization_decision']=='NOT_CREATED'
          assert v2['current_gate_state']['operative_single_use_grant']=='NOT_CREATED'
          assert v2['current_gate_state']['backend_import']=='NOT_EXECUTED'
          assert v2['current_gate_state']['solver_execution']=='NOT_EXECUTED'
          assert v2['current_gate_state']['K1-D']=='NOT_RELEASED'
          assert v2['current_gate_state']['K1-E']=='NOT_ADMISSIBLE'
          assert v2['physical_gate_effect']=='NONE'
          assert v2['physical_evidence_effect']=='NONE'
          assert root['status']=='DRAFT_NO_RATIFIED_TRUST_ROOT'
          assert root['authorities']==[]
          print('Versioned owner-ratification bridge and firewalls: PASS')
          PY

      - name: Publish nonoperative QA summary
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          ## ULSH-01 WP2 owner-ratification bridge v0.2

          - v0.1 operative path: SUPERSEDED / FAIL-CLOSED
          - v0.2 bridge contract: DRAFT_NOT_RATIFIED
          - operative-shaped decision without owner ratification: FAIL-CLOSED
          - operative-shaped grant without owner ratification: FAIL-CLOSED
          - forged owner fields / unreferenced Go: no bypass
          - synthetic controls: PASS, nonoperative
          - Trust Root: NOT RATIFIED
          - Runtime issuance: BLOCKED
          - AuthorizationDecision / SingleUseGrant: NOT CREATED
          - backend import / solver execution: NOT EXECUTED
          - K1-D: NOT RELEASED
          - K1-E: NOT ADMISSIBLE
          - physical gate/evidence effect: NONE
          EOF
