name: UniverseLab phase2 navigation shell cleanup v1.0

on:
  push:
    branches:
      - 2026-08-31-sitewide-audit-phase2-cleanup

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 2026-08-31-sitewide-audit-phase2-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply targeted cleanup
        run: python tools/2026-08-31_UniverseLab_Phase2NavigationShellCleanup_v1.0.py
      - name: Commit cleanup if needed
        run: |
          if git diff --quiet; then
            echo "No cleanup changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          git commit -m "fix(site): modernize active navigator and GlobalShell references"
          git push origin HEAD:2026-08-31-sitewide-audit-phase2-cleanup
