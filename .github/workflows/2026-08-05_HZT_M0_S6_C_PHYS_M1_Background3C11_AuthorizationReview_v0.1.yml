name: HZT-M0-S6 C-PHYS-M1 Background-3C11 authorization review

on:
  pull_request:
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11AuthorizationReviewLedger_v0.1.md"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py"
      - ".github/workflows/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11_AuthorizationReview_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11AuthorizationReviewLedger_v0.1.md"
      - "tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py"
      - "tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py"
      - ".github/workflows/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11_AuthorizationReview_v0.1.yml"

permissions:
  contents: read

jobs:
  review-target-path-authorization-no-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate and compile review artifacts
        run: |
          python -m json.tool registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json >/dev/null
          python -m py_compile tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py
          python -m py_compile tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py
      - name: Run fail-closed authorization review
        run: |
          python tools/2026-08-05_validate_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py --json
          python tests/2026-08-05_test_hzt_m0_s6_c_phys_m1_background_3c11_v0.1.py
      - name: Enforce absence of target release grant and physical results
        run: |
          test ! -e tools/2026-08-05_hzt_m0_s6_c_phys_m1_background_3c12_target_path_release_v0.1.py
          test ! -e registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C12SingleUseGrantContract_v0.1.json
          test ! -e registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -e registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
          grep -q '"authorized": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"grant_created": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"physical_backend_imported": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"cp01r1_attempted": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"target_a_F_one_quarter_solve_attempted": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"result_artifact_created": false' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-05_HZT_M0_S6_C_PHYS_M1_Background3C11RealBackendControlAuthorizationReview_v0.1.json
