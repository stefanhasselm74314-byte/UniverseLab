name: HZT-M0-S6 C-PHYS-M1 BACKGROUND-3A

on:
  pull_request:
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationLedger_v0.1.md"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3A_v0.1.txt"
      - "tools/2026-08-04_verify_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3A_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationLedger_v0.1.md"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3A_v0.1.txt"
      - "tools/2026-08-04_verify_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3A_v0.1.yml"

permissions:
  contents: read

jobs:
  verify-background-3a-preregistration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned preregistration environment
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3A_v0.1.txt

      - name: Validate contract JSON
        run: |
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationContract_v0.1.json >/dev/null

      - name: Compile verifier and tests
        run: |
          python -m py_compile tools/2026-08-04_verify_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py

      - name: Verify exact control seed and method freeze
        run: python tools/2026-08-04_verify_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py --json

      - name: Run fail-closed regression tests
        run: python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_v0.1.py

      - name: Enforce no-execution and evidence firewall
        shell: bash
        run: |
          set -euo pipefail
          FILE=registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3APreregistrationContract_v0.1.json
          grep -q '"status": "METHOD_PREREGISTERED_EXECUTION_NOT_AUTHORIZED"' "$FILE"
          grep -q '"official_solver_authorized": false' "$FILE"
          grep -q '"diagnostic_execution_authorized_in_this_block": false' "$FILE"
          grep -q '"current_execution_state": "NOT_STARTED"' "$FILE"
          grep -q '"result_artifact_created": false' "$FILE"
          grep -q '"BACKGROUND_3B": "NOT_STARTED"' "$FILE"
          grep -q '"physical_background": "NOT_ESTABLISHED"' "$FILE"
          grep -q '"background_existence": "NOT_PROVEN"' "$FILE"
          grep -q '"background_uniqueness": "NOT_PROVEN"' "$FILE"
          grep -q '"Fredholm_property": "NOT_PROVEN"' "$FILE"
          grep -q '"continuum_BVP_Jacobian": "NOT_PROVEN"' "$FILE"
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' "$FILE"
          grep -q '"R1.1": "BLOCKED"' "$FILE"
          grep -q '"R1.2": "BLOCKED"' "$FILE"
          grep -q '"K1-D": "NOT_RELEASED"' "$FILE"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$FILE"
          grep -q '"physical_evidence_effect": "NONE"' "$FILE"
