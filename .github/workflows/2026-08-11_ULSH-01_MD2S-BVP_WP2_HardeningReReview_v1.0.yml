name: ULSH-01 WP2 hardening re-review no-solve

on:
  pull_request:
    paths:
      - "registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.json"
      - "tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr2_review_v1.0.py"
      - "tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewTest_v1.0.py"
      - "science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewLedger_v1.0.md"
      - ".github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.json"
      - "tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr2_review_v1.0.py"
      - "tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewTest_v1.0.py"
      - "science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewLedger_v1.0.md"
      - ".github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.yml"

permissions:
  contents: read

jobs:
  rereview-no-solve:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile RR2 reviewer and tests
        run: |
          python -m py_compile tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr2_review_v1.0.py
          python -m py_compile tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewTest_v1.0.py

      - name: Validate RR2 review JSON
        run: python -m json.tool registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.json >/dev/null

      - name: Reproduce independent RR2 review
        run: python tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr2_review_v1.0.py >/tmp/ulsh_wp2_rr2_review.json

      - name: Run RR2 no-solve tests
        run: python tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReviewTest_v1.0.py -v

      - name: Hard release and solver firewall
        run: |
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_PhysicalSolveReleaseAuthorization_v1.1.json
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.1.json
          python - <<'PY'
          from pathlib import Path
          review = Path('registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.json').read_text(encoding='utf-8')
          workflow = Path('.github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP2_HardeningReReview_v1.0.yml').read_text(encoding='utf-8')
          assert '"review_status": "BLOCKED_WP2_RR2_NEW_RELEASE_BLOCKERS_FOUND_NO_SOLVE"' in review
          assert '"physical_solve_authorized": false' in review
          assert '"physical_solve_executed": false' in review
          assert '"physical_evidence_effect": "NONE"' in review
          run_lines = [line.strip() for line in workflow.splitlines() if line.lstrip().startswith('run:')]
          forbidden = ('transaction_v1.1.py execute', 'execute_physical_schedule(', 'damped_newton(', 'shooting_residual(')
          assert not any(token in line for line in run_lines for token in forbidden), run_lines
          PY
