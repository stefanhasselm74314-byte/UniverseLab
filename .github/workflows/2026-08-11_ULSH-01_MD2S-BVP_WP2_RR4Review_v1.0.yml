name: ULSH-01 WP2-RR4 H3 independent re-review no-solve

on:
  push:
    paths:
      - 'registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.json'
      - 'tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr4_review_v1.0.py'
      - 'tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4ReviewTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Ledger_v1.0.md'
      - '.github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.yml'
  pull_request:
    paths:
      - 'registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.json'
      - 'tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr4_review_v1.0.py'
      - 'tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4ReviewTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Ledger_v1.0.md'
      - '.github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.yml'

permissions:
  contents: read

jobs:
  rr4-no-solve:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile RR4 reviewer and tests
        run: |
          python -m py_compile tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr4_review_v1.0.py
          python -m py_compile tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4ReviewTest_v1.0.py
      - name: Validate RR4 review JSON
        run: python -m json.tool registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.json >/dev/null
      - name: Reproduce independent RR4 review
        run: python tools/2026-08-11_ulsh_01_md2s_bvp_wp2_rr4_review_v1.0.py >/tmp/ulsh_wp2_rr4.json
      - name: Run RR4 no-solve tests
        run: python tests/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4ReviewTest_v1.0.py
      - name: Hard release and solver firewall
        shell: bash
        run: |
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_PhysicalSolveReleaseAuthorization_v1.3.json
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.3.json
          ! grep -R --line-number --fixed-strings 'physical_solve_authorized": true' registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.json
          ! grep -R --line-number --fixed-strings 'physical_evidence_effect": "POSITIVE"' registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_RR4Review_v1.0.json
