name: Hassi OrbitalClock v0.5 APK
on:
  workflow_dispatch:
  push:
    branches:
      - feature/hassi-orbitalclock-android-v05-20261120
    paths:
      - 'apps/hassi-orbitalclock/**'
      - '.github/workflows/hassi-orbitalclock-apk.yml'
      - 'apps/hassi-orbitalclock/settings.gradle'
      - 'apps/hassi-orbitalclock/gradle.properties'
      - 'apps/hassi-orbitalclock/build.gradle'
jobs:
  assemble:
    defaults:
      run:
        working-directory: apps/hassi-orbitalclock
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Restore private release signing key when configured
        shell: bash
        env:
          ORBITAL_SIGNING_KEYSTORE_B64: ${{ secrets.ORBITAL_SIGNING_KEYSTORE_B64 }}
          ORBITAL_SIGNING_PASSWORD: ${{ secrets.ORBITAL_SIGNING_PASSWORD }}
          ORBITAL_SIGNING_ALIAS: ${{ secrets.ORBITAL_SIGNING_ALIAS }}
          ORBITAL_SIGNING_KEY_PASSWORD: ${{ secrets.ORBITAL_SIGNING_KEY_PASSWORD }}
        run: |
          if [[ -n "${ORBITAL_SIGNING_KEYSTORE_B64}" && -n "${ORBITAL_SIGNING_PASSWORD}" && -n "${ORBITAL_SIGNING_ALIAS}" && -n "${ORBITAL_SIGNING_KEY_PASSWORD}" ]]; then
            echo "$ORBITAL_SIGNING_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/orbital-signing.jks"
            echo "ORBITAL_SIGNING_FILE=$RUNNER_TEMP/orbital-signing.jks" >> "$GITHUB_ENV"
            echo "ORBITAL_SIGNING_PASSWORD=$ORBITAL_SIGNING_PASSWORD" >> "$GITHUB_ENV"
            echo "ORBITAL_SIGNING_ALIAS=$ORBITAL_SIGNING_ALIAS" >> "$GITHUB_ENV"
            echo "ORBITAL_SIGNING_KEY_PASSWORD=$ORBITAL_SIGNING_KEY_PASSWORD" >> "$GITHUB_ENV"
            echo "ORBITAL_SIGNED_RELEASE=true" >> "$GITHUB_ENV"
          else
            echo "ORBITAL_SIGNED_RELEASE=false" >> "$GITHUB_ENV"
          fi
      - name: Build signed release (when configured) or debug APK
        run: |
          if [[ "$ORBITAL_SIGNED_RELEASE" == true ]]; then
            gradle --no-daemon assembleRelease --stacktrace
            echo "APK_FILE=apps/hassi-orbitalclock/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
          else
            gradle --no-daemon assembleDebug --stacktrace
            echo "APK_FILE=apps/hassi-orbitalclock/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassi-OrbitalClock-v0.5-apk
          path: ${{ env.APK_FILE }}
          if-no-files-found: error
