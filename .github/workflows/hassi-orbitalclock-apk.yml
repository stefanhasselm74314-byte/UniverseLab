name: Hassi OrbitalClock · Android APK
on:
  push:
    branches:
      - feature/hassi-orbitalclock-android-v03-20261120
    paths:
      - 'apps/hassi-orbitalclock/**'
      - '.github/workflows/hassi-orbitalclock-apk.yml'
  workflow_dispatch:
jobs:
  build:
    name: Build Android debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: apps/hassi-orbitalclock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Build native APK
        run: gradle --no-daemon assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hassi-OrbitalClock-v0.3-debug-apk
          path: apps/hassi-orbitalclock/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
