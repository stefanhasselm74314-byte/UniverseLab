name: ULSH-01 SIM-70 response-rank evidence v1.5 QA

on:
  pull_request:
    paths:
      - 'ulsh/ULSH-01/C-PHYS/2026-09-29_hzt_physical_response_rank_evidence_auditor_v1.5.py'
      - 'ulsh/ULSH-01/C-PHYS/2026-09-29_test_hzt_physical_response_rank_evidence_auditor_v1.5.py'
      - 'ulsh/ULSH-01/C-PHYS/2026-09-28_hzt_physical_response_rank_auditor_v1.4.py'
      - 'requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt'
      - '.github/workflows/2026-09-29_ULSH01_SIM70_ResponseRankEvidence_v1.5_QA.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sim70-response-rank-evidence:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install frozen numerical dependencies
        run: |
          python -m pip install --disable-pip-version-check \
            -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt
          python - <<'PY'
          import importlib.metadata as md
          expected = {
              'numpy': '2.1.3',
              'scipy': '1.14.1',
              'sympy': '1.13.3',
              'mpmath': '1.3.0',
          }
          got = {name: md.version(name) for name in expected}
          assert got == expected, (got, expected)
          print('SIM-70 dependency lock: PASS', got)
          PY

      - name: Compile response-rank evidence auditor
        run: |
          python -m py_compile \
            ulsh/ULSH-01/C-PHYS/2026-09-29_hzt_physical_response_rank_evidence_auditor_v1.5.py \
            ulsh/ULSH-01/C-PHYS/2026-09-29_test_hzt_physical_response_rank_evidence_auditor_v1.5.py

      - name: Run adversarial F12-F14 QA
        run: |
          python ulsh/ULSH-01/C-PHYS/2026-09-29_test_hzt_physical_response_rank_evidence_auditor_v1.5.py

      - name: Assert numerical-only firewalls
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path(
              'ulsh/ULSH-01/C-PHYS/2026-09-29_hzt_physical_response_rank_evidence_auditor_v1.5.py'
          ).read_text(encoding='utf-8')
          assert '"physical_interpretation": "NONE"' in source
          assert '"canonical_effect": "NONE"' in source
          assert '"K1-D": "NOT_RELEASED"' in source
          assert '"K1-E": "NOT_ADMISSIBLE"' in source
          assert 'physical_execution_authorized = True' not in source
          print('SIM-70 v1.5 firewalls: PASS')
          PY
