name: HZT-M0 S6 C-PHYS H3 Time-Dependent 6D M1 Closure v0.2

on:
  pull_request:
    paths:
      - "registry/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.json"
      - "science/hzt-m0/md2s/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.md"
      - "tools/2026-08-13_validate_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py"
      - "tests/2026-08-13_test_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py"
      - ".github/workflows/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.json"
      - "science/hzt-m0/md2s/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.md"
      - "tools/2026-08-13_validate_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py"
      - "tests/2026-08-13_test_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py"
      - ".github/workflows/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.yml"

permissions:
  contents: read

jobs:
  validate-h3-v02-correction:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON
        run: python -m json.tool registry/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.json >/dev/null
      - name: Compile correction validator and tests
        run: |
          python -m py_compile tools/2026-08-13_validate_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py
          python -m py_compile tests/2026-08-13_test_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py
      - name: Run rank-one counterexample regression
        run: python tests/2026-08-13_test_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py
      - name: Validate correction contract
        run: python tools/2026-08-13_validate_hzt_m0_s6_c_phys_h3_time_dependent_6d_m1_closure_v0.2.py --json
      - name: Enforce corrected governance state
        shell: bash
        run: |
          set -euo pipefail
          F=registry/2026-08-13_HZT-M0_S6_C-PHYS_H3_TimeDependent6D_M1_CosmologicalClosure_v0.2.json
          grep -q '"v0_1_no_go": "FALSIFIED_BY_EXPLICIT_RANK_ONE_COUNTEREXAMPLE"' "$F"
          grep -q '"H3_v0_1_rank_one_no_go": "RETRACTED_FALSIFIED_BY_COUNTEREXAMPLE"' "$F"
          grep -q '"H3_rank_one_target_realisability": "PASS_KINEMATIC_SOURCE_FREE"' "$F"
          grep -q '"K1-D": "NOT_RELEASED"' "$F"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$F"
          grep -q '"WP4": "BLOCKED"' "$F"
          grep -q '"physical_evidence_effect": "NONE"' "$F"
