name: ULSH-01 WP3-D6 CP01R2 failed execution review no-rerun

on:
  push:
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReview_v1.0.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d6_cp01r2_failed_execution_review_v1.0.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewLedger_v1.0.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReview_v1.0.yml'
  pull_request:
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReview_v1.0.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d6_cp01r2_failed_execution_review_v1.0.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewLedger_v1.0.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReview_v1.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  failed-execution-review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate review JSON
        run: python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReview_v1.0.json >/dev/null

      - name: Compile stdlib-only review audit and test
        run: |
          python -m py_compile tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d6_cp01r2_failed_execution_review_v1.0.py
          python -m py_compile tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewTest_v1.0.py

      - name: Audit exact source-bound failure semantics
        run: python tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d6_cp01r2_failed_execution_review_v1.0.py

      - name: Run D6 no-rerun regression test
        run: python tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6_CP01R2FailedExecutionReviewTest_v1.0.py

      - name: Confirm spent runtime authorization and grant are not committed
        shell: bash
        run: |
          set -euo pipefail
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D3H1_CP01R2_PhysicalSolveReleaseAuthorization_v1.0.json
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D3H1_CP01R2_SingleUseExecutionGrant_v1.0.json
          echo 'PASS: spent runtime artifacts remain ephemeral; no replay path is committed.'
