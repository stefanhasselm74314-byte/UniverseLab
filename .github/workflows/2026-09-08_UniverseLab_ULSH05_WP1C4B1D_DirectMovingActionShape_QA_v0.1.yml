  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wp1c4b1d-direct-moving-action-shape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WP1C4B1D standalone validator
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B1D_DirectMovingActionShape_v0.1.py
      - name: Re-run WP1C4B1C passive constraint
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B1C_PassiveShapeConstraint_v0.1.py
      - name: Re-run WP1C4B1B Shape-Ward preflight
        run: python tests/2026-09-07_test_UniverseLab_ULSH05_WP1C4B1B_ShapeWardResidual_v0.1.py
      - name: Re-run WP1C4B1A moving-domain transport
        run: python tests/2026-09-07_test_UniverseLab_ULSH05_WP1C4B1A_MovingDomainTransportMaster_v0.1.py
      - name: Validate declared dependency closure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          root=Path('.')
          d=json.loads((root/'registry/2026-09-08_UniverseLab_ULSH05_WP1C4B1D_DirectMovingActionShape_v0.1.json').read_text())
          deps=d['dependencies']
          assert len(deps)==len(set(deps))==8
          for rel in deps:
              assert (root/rel).is_file(), rel
          print('WP1C4B1D dependency closure: PASS')
          PY
      - name: Fail closed on physical or second-order promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('registry/2026-09-08_UniverseLab_ULSH05_WP1C4B1D_DirectMovingActionShape_v0.1.json').read_text())
          g=d['gate_state']
          assert d['physical_gate_effect']=='NONE'
          assert d['physical_evidence_effect']=='NONE'
          assert d['solver_authorized'] is False
          assert g['WP1_direct_moving_action_first_variation']=='DERIVED_INTERFACE_DECOMPOSITION'
          assert g['WP1_direct_shape_residual']=='DERIVED_AS_NN_CONSTRAINT_JUMP'
          assert g['WP1_first_shape_equivalence']=='DERIVED_DIRECT_ACTION_TO_PASSIVE_CONSTRAINT'
          assert g['WP1_first_shape_level']=='CLOSED_ANALYTICALLY_AS_REDUNDANT_CONSTRAINT_CHANNEL'
          assert g['WP1_full_boundary_hessian']=='NOT_CLOSED'
          assert g['WP1_full_quadratic_action']=='NOT_CLOSED'
          assert g['PERTURBED_JUNCTION_SYSTEM']=='NOT_RELEASED'
          assert g['PHYSICAL_BACKGROUND']=='NOT_ESTABLISHED'
          assert g['FM-G0']=='OPEN'
          assert g['AuthorizationDecision']=='NOT_CREATED'
          assert g['SingleUseGrant']=='NOT_CREATED'
          assert g['BACKEND_IMPORT']=='NOT_EXECUTED'
          assert g['SOLVER_EXECUTION']=='NOT_EXECUTED'
          assert g['PHYSICAL_RESPONSE_RANK']=='NOT_EXECUTED'
          assert g['K1-D']=='NOT_RELEASED'
          assert g['K1-E']=='NOT_ADMISSIBLE'
          print('WP1C4B1D firewalls: PASS')
          PY
