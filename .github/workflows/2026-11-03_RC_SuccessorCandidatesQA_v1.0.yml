name: RC-VALIDATION-06 successor candidates QA
on:
  pull_request:
    paths:
      - 'drafts/2026-11-03_UniverseLab_*_DRAFT.json'
      - '.github/workflows/2026-11-03_RC_SuccessorCandidatesQA_v1.0.yml'
      - 'tests/2026-11-03_test_UniverseLab_RC08_SemanticState_v1.0.py'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fail-closed candidate checks
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          root=pathlib.Path('.')
          p=['drafts/2026-11-03_UniverseLab_CurrentMainCanonicalState_v1.4_DRAFT.json',
             'drafts/2026-11-03_UniverseLab_SessionCheckpoint_v1.35_DRAFT.json',
             'drafts/2026-11-03_UniverseLab_ProjectManifest_v2.35_DRAFT.json']
          old=['registry/2026-09-04_UniverseLab_CurrentMainCanonicalState_v1.3.json',
               'registry/2026-09-04_UniverseLab_SessionCheckpoint_v1.34.json',
               'project-manifest.json']
          new=[json.loads((root/x).read_text()) for x in p]
          prior=[json.loads((root/x).read_text()) for x in old]
          for n,o in zip(new,prior):
            assert set(o).issubset(set(n)), 'original keys lost'
            assert n['physical_gate_effect']==o['physical_gate_effect']=='NONE'
            assert n['physical_evidence_effect']==o['physical_evidence_effect']=='NONE'
            assert n['reconciliation_addendum']['status']=='DRAFT_NOT_CANONICAL'
            assert n['reconciliation_addendum']['nonoperative_only'] is True
            assert n['reconciliation_addendum']['review_required'] is True
            assert n['reconciliation_addendum']['current_merge_tree_status']=='VERIFIED_GIT_OBJECT_PINNED_MERGE_COMMIT'
            assert n['reconciliation_addendum']['reconciliation_basis_commit']=='51bcc8fccb092c104ac0fca5fc98a5b996dcb914'
            for src in n['reconciliation_addendum']['source_registry'].values():
              assert (root/src).is_file(),src
              json.loads((root/src).read_text())
          for k in ('K1-D','K1-E','FM-G0'):
            assert new[2]['gates'][k]==prior[2]['gates'][k]
            assert new[1]['gate_state'][k]==prior[1]['gate_state'][k]
          assert new[0]['physical_governance']==prior[0]['physical_governance']
          assert new[1]['physical_governance']==prior[1]['physical_governance']
          assert new[2]['canonical_state']==p[0] and new[1]['canonical_state']==p[0]
          assert new[2]['session_checkpoint']==p[1]
          assert new[0]['basis_main_commit']==new[2]['basis_main_commit']==new[1]['basis_commit']
          print('PASS: draft candidates, original keys, source paths, pointer and gate firewalls')
          print('NOT VALIDATED: full scientific state reconciliation, final schema release')
          PY
      - name: RC08 source-bound semantic audit and negative controls
        run: python3 tests/2026-11-03_test_UniverseLab_RC08_SemanticState_v1.0.py
