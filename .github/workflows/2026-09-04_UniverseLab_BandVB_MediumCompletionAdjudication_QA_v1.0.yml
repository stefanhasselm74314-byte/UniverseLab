      - 'validation.html'
  push:
    branches: [main]
    paths:
      - 'registry/2026-09-04_UniverseLab_PublicScientificMediumCompletionAdjudication_v1.0.json'
      - 'registry/2026-09-04_UniverseLab_PublicScientificMediumAdjudicationSummary_v1.0.json'
      - 'science/audit/2026-09-04_UniverseLab_BandVB_MediumCompletionAdjudication_v1.0.md'
      - 'tests/2026-09-04_test_UniverseLab_BandVB_MediumCompletionAdjudication_v1.0.py'
      - '.github/workflows/2026-09-04_UniverseLab_BandVB_MediumCompletionAdjudication_QA_v1.0.yml'
