name: ChatArchiv Android APK (isolierter Branch)

on:
  push:
    branches:
      - app/chatarchiv-android-readonly-v1
      - app/chatarchiv-research-navigator-v0
      - app/chatarchiv-research-qa-v041
      - app/chatarchiv-stable-update-v042
      - app/chatarchiv-timeline-qa-v043
    paths:
      - 'tools/chatarchiv-android/**'
      - '.github/workflows/chatarchiv-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Debug APK & Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          test -d "$ANDROID_HOME/cmdline-tools"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)
          test -n "$SDKMANAGER"
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Test parser and assemble debug APK
        working-directory: tools/chatarchiv-android
        run: gradle --no-daemon --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease
      - name: Verify APK exists
        run: test -s tools/chatarchiv-android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload installierbare APK
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLab-ChatArchiv-Android-APK
          path: tools/chatarchiv-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 90
      # Signing keys NEVER enter public CI or public repository. Release is unsigned here;
      # the project owner's existing private keystore signs it offline after download.
      - name: Verify unsigned release APK
        run: test -s tools/chatarchiv-android/app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Upload unsigned release for private signing
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLab-ChatArchiv-Unsigned-Release
          path: tools/chatarchiv-android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30
      - name: Stage signing verification utility
        run: |
          APKSIGNER_JAR=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner.jar | sort -V | tail -1)
          test -n "$APKSIGNER_JAR"
          mkdir -p tools/chatarchiv-android/signing-tool
          cp "$APKSIGNER_JAR" tools/chatarchiv-android/signing-tool/apksigner.jar
      - name: Export signing verification utility
        uses: actions/upload-artifact@v4
        with:
          name: Android-APK-Signing-Utility
          path: tools/chatarchiv-android/signing-tool/apksigner.jar
          if-no-files-found: error
          retention-days: 7
