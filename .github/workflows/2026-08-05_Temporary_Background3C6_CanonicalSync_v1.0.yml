name: Temporary Background-3C6 manifest drift correction

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  synchronize:
    if: ${{ github.head_ref == 'agent/background-3c6-status-sync-v1-0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Correct nested Background-3C6 manifest drift
        run: python tools/2026-08-05_apply_background3c6_manifest_drift_correction_v1.0.py
      - name: Commit corrected manifest and remove temporary script
        run: |
          git config user.name 'UniverseLab Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add project-manifest.json
          git rm tools/2026-08-05_apply_background3c6_manifest_drift_correction_v1.0.py
          git commit -m '[background3c6-sync] Correct nested manifest status drift'
          git push origin HEAD:${{ github.head_ref }}
