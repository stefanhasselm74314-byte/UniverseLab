name: UniverseLab MD-2S C1 independent backend continuation

on:
  pull_request:
    paths:
      - "registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_C1_IndependentBackendContinuationLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json"
      - "tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py"
      - "tests/2026-08-03_test_md2s_c1_independent_backend_continuation_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_C1_IndependentBackendContinuation_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_C1_IndependentBackendContinuationLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json"
      - "tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py"
      - "tests/2026-08-03_test_md2s_c1_independent_backend_continuation_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_C1_IndependentBackendContinuation_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-md2s-c1-independent-backend-continuation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON artifacts
        run: |
          python -m json.tool registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json >/dev/null

      - name: Compile evaluator and tests
        run: |
          python -m py_compile tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py
          python -m py_compile tests/2026-08-03_test_md2s_c1_independent_backend_continuation_v0.1.py

      - name: Run independent backend tests
        run: python tests/2026-08-03_test_md2s_c1_independent_backend_continuation_v0.1.py

      - name: Enforce independent backend and tangent preflight
        run: python tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py --mode validate

      - name: Verify governance firewall
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"official_solver_authorized": false' registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json
          grep -q '"continuum_implicit_function_theorem_application": "NOT_PROVEN"' registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json
          grep -q '"C1_NONLINEAR_CONTINUATION": "NOT_EXECUTED"' science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json
          grep -q '"C1_ROOT_CORRECTOR": "NOT_IMPLEMENTED"' science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json
          grep -q '"C1_OFFICIAL_SOLVER": "NOT_AUTHORIZED"' science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.6.json
          grep -q '"R1.1": "BLOCKED"' registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-03_MD2S_C1_IndependentBackendContinuationContract_v0.1.json
