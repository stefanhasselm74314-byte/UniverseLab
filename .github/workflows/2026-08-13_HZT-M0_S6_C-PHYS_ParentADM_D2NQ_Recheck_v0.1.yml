          python -m py_compile tools/2026-08-13_validate_hzt_m0_s6_c_phys_parent_adm_d2nq_recheck_v0.1.py
          python -m py_compile tests/2026-08-13_test_hzt_m0_s6_c_phys_parent_adm_d2nq_recheck_v0.1.py
      - name: Run independent algebra regression suite
        run: python tests/2026-08-13_test_hzt_m0_s6_c_phys_parent_adm_d2nq_recheck_v0.1.py
      - name: Validate canonical source bindings and firewalls
        run: python tools/2026-08-13_validate_hzt_m0_s6_c_phys_parent_adm_d2nq_recheck_v0.1.py --json
      - name: Enforce no-release interpretation firewall
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"gemini_blocks": "EXTERNAL_UNVERIFIED_GEMINI_DRAFT"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"full_parent_to_B_squared_map": "OPEN"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"full_ghost_freedom": "OPEN"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"global_bounce": "OPEN"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"WP4": "BLOCKED"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
          grep -q '"physical_evidence_effect": "NONE"' registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json
