jobs:
  validate-parent-adm-d2nq-recheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON syntax
        run: python -m json.tool registry/2026-08-13_HZT-M0_S6_C-PHYS_ParentADM_D2NQ_Recheck_v0.1.json >/dev/null
      - name: Compile validator and tests
