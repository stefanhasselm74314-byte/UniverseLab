name: UniverseLab MD-2S junction contract

on:
  pull_request:
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_BulkLocalizedActionAndJunctionLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.2.json"
      - "registry/2026-08-03_MD2S_JunctionContract_v0.1.json"
      - "tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py"
      - "tests/2026-08-03_test_md2s_junctions_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_JunctionContract_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_BulkLocalizedActionAndJunctionLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.2.json"
      - "registry/2026-08-03_MD2S_JunctionContract_v0.1.json"
      - "tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py"
      - "tests/2026-08-03_test_md2s_junctions_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_JunctionContract_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-md2s-junctions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON contracts
        run: |
          python -m json.tool registry/2026-08-03_MD2S_JunctionContract_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.2.json >/dev/null

      - name: Compile evaluator and tests
        run: |
          python -m py_compile tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py
          python -m py_compile tests/2026-08-03_test_md2s_junctions_v0.1.py

      - name: Run junction regression tests
        run: python tests/2026-08-03_test_md2s_junctions_v0.1.py -v

      - name: Verify structural equations and orientation contract
        run: |
          grep -F "sum_s [K_ab^(s) - K_s h_ab] = kappa6^2 S_ab" science/hzt-m0/md2s/2026-08-03_MD2S_BulkLocalizedActionAndJunctionLedger_v0.1.md
          grep -F "Y_sigma,required = (L_Sigma - A_Sigma)/kappa6^2" science/hzt-m0/md2s/2026-08-03_MD2S_BulkLocalizedActionAndJunctionLedger_v0.1.md
          grep -F "sum_s Z_phi,s n_s^r phi_s'" science/hzt-m0/md2s/2026-08-03_MD2S_BulkLocalizedActionAndJunctionLedger_v0.1.md
          grep -F "global_flux_quantization_separate" registry/2026-08-03_MD2S_JunctionContract_v0.1.json

      - name: Verify governance firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          contract = json.loads(Path('registry/2026-08-03_MD2S_JunctionContract_v0.1.json').read_text())
          freeze = json.loads(Path('science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.2.json').read_text())
          assert contract['solver_authorized'] is False
          assert contract['freeze_effect']['MF-001'] == 'PARTIAL_STRUCTURAL_FREEZE'
          assert contract['freeze_effect']['MF-002'] == 'PARTIAL_STRUCTURAL_FREEZE'
          assert contract['freeze_effect']['MF-005'] == 'PARTIAL_CONDITIONAL'
          assert contract['freeze_effect']['R1.1'] == 'BLOCKED'
          assert contract['freeze_effect']['K1-D'] == 'NOT_RELEASED'
          assert contract['freeze_effect']['K1-E'] == 'NOT_ADMISSIBLE'
          assert freeze['solver_authorized'] is False
          assert freeze['governance']['TWO_JUNCTION_VERDICT'] == 'NOT_EXECUTABLE'
          PY

      - name: Run existing MD-2S and research checks
        run: |
          python tests/test_verify_md2s_recovery_package_v0_1.py -v
          python tests/2026-08-03_test_md2s_radial_equations_v0.1.py -v
