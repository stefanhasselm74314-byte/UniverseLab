name: UniverseLab MD-2S junction contract

on:
  pull_request:
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_OrientedCapJunctionLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ActionFreezeMatrix_v0.1.json"
      - "registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json"
      - "tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py"
      - "tests/2026-08-03_test_md2s_junctions_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_JunctionContract_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_OrientedCapJunctionLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ActionFreezeMatrix_v0.1.json"
      - "registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json"
      - "tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py"
      - "tests/2026-08-03_test_md2s_junctions_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_JunctionContract_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-md2s-junctions:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON contracts
        run: |
          python -m json.tool registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/2026-08-03_MD2S_R1_ActionFreezeMatrix_v0.1.json >/dev/null

      - name: Compile evaluator and tests
        run: |
          python -m py_compile tools/2026-08-03_hzt_m0_md2s_junctions_v0.1.py
          python -m py_compile tests/2026-08-03_test_md2s_junctions_v0.1.py

      - name: Run junction tests
        run: python tests/2026-08-03_test_md2s_junctions_v0.1.py -v

      - name: Verify governance firewall
        run: |
          grep -q '"MF-005_NUMERICAL": "BLOCKED"' registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json
          grep -q '"OFFICIAL_SOLVER_IMPLEMENTATION": "FORBIDDEN"' registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-03_MD2S_CapJunctionContract_v0.1.json

      - name: Verify source ledger statements
        run: |
          grep -q 'Y_sigma_required = M6^4 (L_Sigma - A_Sigma)' science/hzt-m0/md2s/2026-08-03_MD2S_OrientedCapJunctionLedger_v0.1.md
          grep -q 'sum_s n_s^r Z_phi,s phi'"'"'_s' science/hzt-m0/md2s/2026-08-03_MD2S_OrientedCapJunctionLedger_v0.1.md
