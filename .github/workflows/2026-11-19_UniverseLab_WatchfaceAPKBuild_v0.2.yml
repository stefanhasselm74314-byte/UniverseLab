name: UniverseLab Wear OS Holo-6D debug APKs

on:
  pull_request:
    paths:
      - 'watchface-build/**'
      - '.github/workflows/2026-11-19_UniverseLab_WatchfaceAPKBuild_v0.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image generator dependencies
        run: python -m pip install 'Pillow==11.3.0'

      - name: Generate Android project from dated source files
        run: python watchface-build/2026-11-19_UL_Holo_Materialize_v0.3.py

      - name: Run structure and geometry checks
        run: python -m unittest discover -s build_watch_holo/tests -v

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Validate WFF v1 with official XML Schema 1.1 validator
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/google/watchface.git "$RUNNER_TEMP/google-watchface"
          git -C "$RUNNER_TEMP/google-watchface" sparse-checkout set third_party/wff
          gradle -p "$RUNNER_TEMP/google-watchface/third_party/wff" :specification:validator:executable-jar --no-daemon
          java -jar "$RUNNER_TEMP/google-watchface/third_party/wff/specification/validator/build/libs/wff-validator.jar" 1 build_watch_holo/watchface/src/main/res/raw/watchface.xml build_watch_holo/holoface/src/main/res/raw/watchface.xml

      - name: Build all three Wear OS debug APKs
        run: gradle -p build_watch_holo :watchface:assembleDebug :compass:assembleDebug :holoface:assembleDebug --no-daemon --stacktrace

      - name: Upload unsigned-for-release but installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLab-Watch-Holo-6D-debug-APKs
          path: |
            build_watch_holo/watchface/build/outputs/apk/debug/*.apk
            build_watch_holo/compass/build/outputs/apk/debug/*.apk
            build_watch_holo/holoface/build/outputs/apk/debug/*.apk
            build_watch_holo/UniverseLab_Holo_6D_Offline_v0.3.html
          if-no-files-found: error
          retention-days: 14
