name: UniverseLab Wear OS debug APKs

on:
  pull_request:
    paths:
      - 'watchface-build/**'
      - '.github/workflows/2026-11-19_UniverseLab_WatchfaceAPKBuild_v0.2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apks:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deterministic image generator dependencies
        run: python -m pip install 'Pillow==11.3.0' 'lxml==6.0.1'

      - name: Generate Android project from dated source files
        run: python watchface-build/2026-11-19_UL_Watch_Materialize_v0.2.py

      - name: Run structure and geometry checks
        run: python -m unittest discover -s build_watch/tests -v

      - name: Check WFF v1 XML against Google's published XSD
        run: |
          git clone --depth=1 --filter=blob:none --sparse https://github.com/google/watchface.git "$RUNNER_TEMP/google-watchface"
          git -C "$RUNNER_TEMP/google-watchface" sparse-checkout set third_party/wff/specification/documents/1
          python -c 'from lxml import etree; from pathlib import Path; import os; schema=Path(os.environ["RUNNER_TEMP"])/"google-watchface/third_party/wff/specification/documents/1/watchface.xsd"; document=Path("build_watch/watchface/src/main/res/raw/watchface.xml"); etree.XMLSchema(etree.parse(str(schema))).assertValid(etree.parse(str(document))); print("WFF v1 XSD: OK")'

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android platform and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build both Wear OS debug APKs
        run: gradle -p build_watch :watchface:assembleDebug :compass:assembleDebug --no-daemon --stacktrace

      - name: Upload unsigned-for-release but installable debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: UniverseLab-Watch-debug-APKs
          path: |
            build_watch/watchface/build/outputs/apk/debug/*.apk
            build_watch/compass/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
