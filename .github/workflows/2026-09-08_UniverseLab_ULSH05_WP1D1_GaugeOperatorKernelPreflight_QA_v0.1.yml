name: 2026-09-08 ULSH05 WP1D1 Gauge Operator Kernel Preflight QA v0.1

on:
  pull_request:
    paths:
      - 'science/solver-hub/2026-09-08_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.md'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.json'
      - 'tests/2026-09-08_test_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.py'
      - 'tools/2026-09-08_prepare_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.py'
      - '.github/workflows/2026-09-08_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_QA_v0.1.yml'
      - 'science/solver-hub/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.md'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.json'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wp1d1-gauge-operator-kernel-preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WP1D1 standalone controls
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.py
      - name: Emit nonoperative WP1D1 summary
        run: python tools/2026-09-08_prepare_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.py
      - name: Rerun WP1D predecessor controls
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.py
      - name: Verify exact fail-closed status
        shell: python
        run: |
          import json
          from pathlib import Path
          d = json.loads(Path('registry/2026-09-08_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.json').read_text(encoding='utf-8'))
          g = d['gate_state']
          assert 'registry/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.json' in d['dependencies']
          assert d['inherited_conditional_domain']['name'] == 'D_cond'
          assert d['inherited_conditional_domain']['status'] == 'FROZEN_CONDITIONAL'
          assert d['inherited_conditional_domain']['physical_release'] is False
          assert d['quotient']['domain_source'] == 'inherited_conditional_domain'
          assert d['gauge_operator']['form'] == 'G=(G_zeta,G_lambda,G_rho)'
          assert d['gauge_operator']['intrinsic_interface_reparametrization']['independent_of_zeta_parallel'] is True
          assert d['columnwise_invariants']['H_ab_under_full_G'] == 'NOT_INVARIANT_IN_GENERAL_RHO_COLUMN_NONZERO'
          assert d['kernel_registry']['projector_zero_mode_implies_gauge_mode'] is False
          assert d['cokernel_registry']['G_dagger_frozen'] is False
          assert d['cokernel_registry']['closed_range_status'] == 'NOT_PROVEN'
          assert d['cokernel_registry']['fredholm_status'] == 'NOT_PROVEN'
          assert d['cokernel_registry']['ordinary_cokernel_equals_adjoint_kernel_requires'] == 'CLOSED_RANGE_OF_G_OR_STRONGER_FREDHOLM_SETTING'
          assert g['WP1D_successor_identifier'] == 'FROZEN_BY_THIS_SUCCESSOR_CONTRACT'
          assert g['WP1D_analytic_field_domain'] == 'FROZEN_CONDITIONAL'
          assert g['WP1D_4D_covariant_SVT_bookkeeping'] == 'DEFINED_CONDITIONAL_PROJECTOR_KERNELS_OPEN'
          assert g['WP1D_gauge_action'] == 'DEFINED_KINEMATICALLY_WITH_INDEPENDENT_SURFACE_REPARAMETERIZATION'
          assert g['WP1D_constraint_elimination'] == 'BLOCKED_BY_ULSH04_AND_UNFROZEN_PHYSICAL_TIME_SLICING'
          assert g['WP1D_physical_3plus1_SVT'] == 'NOT_RELEASED'
          assert g['WP1D_physical_DOF_count'] == 'NOT_RELEASED'
          assert g['WP1_full_global_boundary_hessian'] == 'NOT_CLOSED_PHYSICAL_DOMAIN_NOT_RELEASED'
          assert g['WP1_full_quadratic_action'] == 'NOT_CLOSED'
          assert g['WP1D1_closed_range_of_G'] == 'NOT_PROVEN'
          assert g['WP1D1_Fredholm_property_of_G'] == 'NOT_PROVEN'
          assert g['FM-G0'] == 'OPEN'
          assert g['PHYSICAL_BACKGROUND'] == 'NOT_ESTABLISHED'
          assert g['SOLVER_EXECUTION'] == 'NOT_EXECUTED'
          assert d['physical_gate_effect'] == 'NONE'
          assert d['physical_evidence_effect'] == 'NONE'
          print('WP1D1 fail-closed firewalls: PASS')
