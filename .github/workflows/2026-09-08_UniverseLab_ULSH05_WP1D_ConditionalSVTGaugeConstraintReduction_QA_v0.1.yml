name: 2026-09-08 ULSH05 WP1D Conditional SVT Gauge Constraint Reduction QA v0.1

on:
  pull_request:
    paths:
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.json'
      - 'science/solver-hub/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.md'
      - 'tests/2026-09-08_test_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.py'
      - 'tools/2026-09-08_prepare_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.py'
      - '.github/workflows/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_QA_v0.1.yml'
      - 'science/solver-hub/2026-09-07_UniverseLab_ULSH05_WP1C3_CapBendingJunctionGeometry_v0.1.md'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1C4B2C_GlobalBoundaryDomainPreflight_v0.1.json'
      - 'tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B2C_GlobalBoundaryDomainPreflight_v0.1.py'
      - 'science/solver-hub/2026-08-07_ULSH-04_Constraint_Roadmap_v1.0.md'
      - 'science/solver-hub/2026-08-07_ULSH-05_SVT-Perturbation_Roadmap_v1.0.md'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  wp1d-conditional-gauge-constraint-reduction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run WP1D standalone controls
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.py
      - name: Emit nonoperative WP1D summary
        run: python tools/2026-09-08_prepare_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.py
      - name: Rerun predecessor WP1C4B2C controls
        run: python tests/2026-09-08_test_UniverseLab_ULSH05_WP1C4B2C_GlobalBoundaryDomainPreflight_v0.1.py
      - name: Verify fail-closed gauge and constraint firewalls
        shell: python
        run: |
          import json
          from pathlib import Path
          p = Path('registry/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.json')
          d = json.loads(p.read_text(encoding='utf-8'))
          g = d['gate_state']
          r = d['gauge_action']['intrinsic_surface_reparameterization']
          q = d['kinematic_quotient']
          assert d['work_package'] == 'ULSH-05/WP1D'
          assert d['successor_assignment']['status'] == 'FROZEN_BY_THIS_SUCCESSOR_CONTRACT'
          assert d['solver_authorized'] is False
          assert d['physical_gate_effect'] == 'NONE'
          assert d['physical_evidence_effect'] == 'NONE'
          assert r['independent_from_bulk_diffeomorphism'] is True
          assert r['must_not_identify_with_zeta_parallel'] is True
          assert r['pure_tangential_chart_mode'] == 'GAUGE_ORBIT_NOT_PHYSICAL_MODE'
          assert q['bulk_vs_surface_reparameterization'] == 'DISTINCT_GAUGE_SYMMETRIES_MUST_NOT_BE_IDENTIFIED'
          assert q['pure_tau_chart_orbit'] == 'NOT_A_PHYSICAL_KINEMATIC_MODE'
          assert d['constraint_elimination']['singular_C'] == 'DIRECT_ELIMINATION_FORBIDDEN'
          assert g['WP1D_gauge_action'] == 'DEFINED_KINEMATICALLY_WITH_INDEPENDENT_SURFACE_REPARAMETERIZATION'
          assert g['WP1D_constraint_elimination'] == 'BLOCKED_BY_ULSH04_AND_UNFROZEN_PHYSICAL_TIME_SLICING'
          assert g['WP1D_physical_3plus1_SVT'] == 'NOT_RELEASED'
          assert g['WP1D_physical_DOF_count'] == 'NOT_RELEASED'
          assert g['WP1_full_quadratic_action'] == 'NOT_CLOSED'
          assert g['PERTURBED_JUNCTION_SYSTEM'] == 'NOT_RELEASED'
          assert g['PHYSICAL_BACKGROUND'] == 'NOT_ESTABLISHED'
          assert g['AuthorizationDecision'] == 'NOT_CREATED'
          assert g['SingleUseGrant'] == 'NOT_CREATED'
          assert g['BACKEND_IMPORT'] == 'NOT_EXECUTED'
          assert g['SOLVER_EXECUTION'] == 'NOT_EXECUTED'
          assert g['PHYSICAL_RESPONSE_RANK'] == 'NOT_EXECUTED'
          assert g['K1-D'] == 'NOT_RELEASED'
          assert g['K1-E'] == 'NOT_ADMISSIBLE'
          print('WP1D fail-closed gauge/constraint firewalls: PASS')
