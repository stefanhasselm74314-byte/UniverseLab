name: Temporary Background-3C3 canonical synchronization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  synchronize:
    if: ${{ github.head_ref == 'agent/background-3c3-status-sync-v1-0' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Background-3C3 canonical synchronization
        run: python tools/2026-08-04_apply_background3c3_canonical_sync_v1.0.py
      - name: Commit canonical state and remove temporary script
        run: |
          git config user.name 'UniverseLab Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add project-manifest.json registry/decision-log.jsonl registry/session-checkpoint-latest.json registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.22.json
          git rm tools/2026-08-04_apply_background3c3_canonical_sync_v1.0.py
          git commit -m '[background3c3-sync] Canonicalize denied authorization review'
          git push origin HEAD:${{ github.head_ref }}
