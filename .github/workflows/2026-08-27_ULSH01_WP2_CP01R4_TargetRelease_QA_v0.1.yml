name: ULSH-01 WP2 CP01R4 grant-gated release QA v0.1

on:
  pull_request:
    paths:
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_RunInputRebind_v0.3.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_ResourcePolicy_v0.2.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_BackendRebindContract_v0.2.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_SingleUseGrantSchema_v0.2.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionSchema_v0.1.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_TargetTransactionContract_v0.2.json'
      - 'ulsh/ULSH-01/C-PHYS/2026-08-21_ULSH01_M1C1_8x8_TargetContract_v0.1.json'
      - 'ulsh/ULSH-01/C-PHYS/2026-08-27_ULSH01_M1C1_8x8_BackendInterfaceContract_v0.1.json'
      - 'ulsh/ULSH-01/C-PHYS/2026-08-27_ULSH01_M1C1_8x8_ResultSchema_v0.1.json'
      - 'registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json'
      - 'tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.2.py'
      - 'tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_primary_kernel_v0.1.py'
      - 'requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt'
      - 'tools/2026-08-27_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py'
      - 'tests/2026-08-27_test_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py'
      - '.github/workflows/2026-08-27_ULSH01_WP2_CP01R4_TargetRelease_QA_v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cp01r4-release-preflight-no-physical-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate CP01R4 JSON contracts
        run: |
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_RunInputRebind_v0.3.json >/dev/null
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_ResourcePolicy_v0.2.json >/dev/null
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_BackendRebindContract_v0.2.json >/dev/null
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_SingleUseGrantSchema_v0.2.json >/dev/null
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionSchema_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_TargetTransactionContract_v0.2.json >/dev/null
      - name: Compile release implementation and QA
        run: |
          python -m py_compile tools/2026-08-27_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py
          python -m py_compile tests/2026-08-27_test_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py
      - name: Assert templates are nonoperative
        run: |
          grep -F '"status": "TEMPLATE_ONLY_NO_GRANT_CREATED"' registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_SingleUseGrantSchema_v0.2.json
          grep -F '"authorized": false' registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_SingleUseGrantSchema_v0.2.json
          grep -F '"status": "TEMPLATE_ONLY_NOT_AUTHORIZED"' registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionSchema_v0.1.json
          grep -F '"solver_execution_allowed": false' registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionSchema_v0.1.json
      - name: Run source-bound release audit only
        run: |
          python tools/2026-08-27_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py audit \
            --repo-root . \
            --manifest-output /tmp/ulsh01_wp2_cp01r4_release_manifest.json \
            --json | tee /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"status": "PASS_CP01R4_RELEASE_PREFLIGHT_IMPLEMENTATION_ONLY"' /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"backend_imported": false' /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"solver_executed": false' /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"physical_execution_authorized": false' /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"WP2_closed": false' /tmp/ulsh01_wp2_cp01r4_preflight.json
          grep -F '"physical_evidence_effect": "NONE"' /tmp/ulsh01_wp2_cp01r4_preflight.json
      - name: Run synthetic grant and barycentric QA only
        run: |
          mkdir -p /tmp/ulsh01_wp2_cp01r4_reservations
          python tools/2026-08-27_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py self-test \
            --repo-root . \
            --reservation-dir /tmp/ulsh01_wp2_cp01r4_reservations \
            --json | tee /tmp/ulsh01_wp2_cp01r4_selftest.json
          grep -F '"status": "PASS_SYNTHETIC_DECISION_GRANT_BINDING_AND_REPLAY_QA"' /tmp/ulsh01_wp2_cp01r4_selftest.json
          grep -F '"backend_imported": false' /tmp/ulsh01_wp2_cp01r4_selftest.json
          grep -F '"solver_executed": false' /tmp/ulsh01_wp2_cp01r4_selftest.json
      - name: Run complete Python QA
        run: python tests/2026-08-27_test_hzt_m0_s6_c_phys_m1_ulsh01_wp2_cp01r4_target_release_v0.1.py
      - name: Verify generated manifest is evidence-neutral
        run: |
          python -m json.tool /tmp/ulsh01_wp2_cp01r4_release_manifest.json >/dev/null
          grep -F '"backend_imported":false' /tmp/ulsh01_wp2_cp01r4_release_manifest.json
          grep -F '"solver_executed":false' /tmp/ulsh01_wp2_cp01r4_release_manifest.json
          grep -F '"physical_evidence_effect":"NONE"' /tmp/ulsh01_wp2_cp01r4_release_manifest.json
      - name: Upload CP01R4 implementation-QA manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulsh01-wp2-cp01r4-release-manifest-qa-only
          path: |
            /tmp/ulsh01_wp2_cp01r4_release_manifest.json
            /tmp/ulsh01_wp2_cp01r4_preflight.json
            /tmp/ulsh01_wp2_cp01r4_selftest.json
