name: ULSH-01 WP2 physical transaction no-solve contract

on:
  pull_request:
    paths:
      - "registry/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.json"
      - "tools/2026-08-10_ulsh_01_md2s_bvp_wp2_target_entrypoint_v1.0.py"
      - "tools/2026-08-10_ulsh_01_md2s_bvp_wp2_transaction_v1.0.py"
      - "tests/2026-08-10_test_ulsh_01_md2s_bvp_wp2_physical_transaction_v1_0.py"
      - "science/hzt-m0/md2s/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionLedger_v1.0.md"
      - ".github/workflows/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.json"
      - "tools/2026-08-10_ulsh_01_md2s_bvp_wp2_target_entrypoint_v1.0.py"
      - "tools/2026-08-10_ulsh_01_md2s_bvp_wp2_transaction_v1.0.py"
      - "tests/2026-08-10_test_ulsh_01_md2s_bvp_wp2_physical_transaction_v1_0.py"
      - "science/hzt-m0/md2s/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionLedger_v1.0.md"
      - ".github/workflows/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.yml"

permissions:
  contents: read

jobs:
  no-solve-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile WP2 sources
        run: |
          python -m py_compile tools/2026-08-10_ulsh_01_md2s_bvp_wp2_target_entrypoint_v1.0.py
          python -m py_compile tools/2026-08-10_ulsh_01_md2s_bvp_wp2_transaction_v1.0.py
          python -m py_compile tests/2026-08-10_test_ulsh_01_md2s_bvp_wp2_physical_transaction_v1_0.py

      - name: Validate WP2 contract JSON
        run: python -m json.tool registry/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.json >/dev/null

      - name: Target audit only
        run: python tools/2026-08-10_ulsh_01_md2s_bvp_wp2_target_entrypoint_v1.0.py >/tmp/ulsh_wp2_target_audit.json

      - name: Transaction audit only
        run: python tools/2026-08-10_ulsh_01_md2s_bvp_wp2_transaction_v1.0.py audit >/tmp/ulsh_wp2_transaction_audit.json

      - name: Run WP2 no-solve tests
        run: python tests/2026-08-10_test_ulsh_01_md2s_bvp_wp2_physical_transaction_v1_0.py -v

      - name: Hard execution firewall
        run: |
          test ! -e registry/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalSolveReleaseAuthorization_v1.0.json
          test ! -e registry/2026-08-10_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.0.json
          python - <<'PY'
          from pathlib import Path
          workflow = Path('.github/workflows/2026-08-10_ULSH-01_MD2S-BVP_WP2_PhysicalTransactionContract_v1.0.yml').read_text()
          run_lines = [line.strip() for line in workflow.splitlines() if line.lstrip().startswith('run:')]
          forbidden = (' transaction_v1.0.py execute', 'execute_physical_schedule(')
          assert not any(token in line for line in run_lines for token in forbidden), run_lines
          PY
