name: ULSH-01 WP3-D1 CP01R1 failure diagnosis no-execution

on:
  pull_request:
    paths:
      - registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosticMatrix_v1.0.json
      - registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosis_CP01R2Protocol_v1.0.json
      - tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d1_failure_diagnosis_v1.0.py
      - tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosisTest_v1.0.py
      - science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosisLedger_v1.0.md
      - .github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosis_v1.0.yml
  push:
    branches: [main]
    paths:
      - registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosticMatrix_v1.0.json
      - registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosis_CP01R2Protocol_v1.0.json
      - tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d1_failure_diagnosis_v1.0.py
      - tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosisTest_v1.0.py

permissions:
  contents: read

jobs:
  diagnosis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate D1 JSON
        run: |
          python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosticMatrix_v1.0.json >/dev/null
          python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosis_CP01R2Protocol_v1.0.json >/dev/null
      - name: Compile D1 audit and tests
        run: |
          python -m py_compile tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d1_failure_diagnosis_v1.0.py
          python -m py_compile tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosisTest_v1.0.py
      - name: Run failure diagnosis audit
        run: python tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d1_failure_diagnosis_v1.0.py
      - name: Run D1 regression tests
        run: python tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_FailureDiagnosisTest_v1.0.py
      - name: Hard no-execution firewall
        run: |
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R2ReleaseAuthorization_v1.0.json
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R2ExecutionGrant_v1.0.json
          grep -q 'DESIGNED_NOT_AUTHORIZED_NOT_EXECUTED' registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosis_CP01R2Protocol_v1.0.json
          grep -q 'DO_NOT_RERUN_CP01R1' registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D1_CP01R1FailureDiagnosis_CP01R2Protocol_v1.0.json
