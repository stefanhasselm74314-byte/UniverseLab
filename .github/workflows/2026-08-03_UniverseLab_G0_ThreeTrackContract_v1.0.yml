name: UniverseLab G0 three-track governance contract

on:
  pull_request:
    paths:
      - "project-manifest.json"
      - "registry/decision-log.jsonl"
      - "registry/session-checkpoint-latest.json"
      - "registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.21.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CIndependentBackendContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CDualBackendPackageContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py"
      - "tools/2026-08-04_validate_g0_three_track_sync_v1.13.py"
      - "tests/2026-08-04_test_g0_three_track_sync_v1.13.py"
      - ".github/workflows/2026-08-03_UniverseLab_G0_ThreeTrackContract_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "project-manifest.json"
      - "registry/decision-log.jsonl"
      - "registry/session-checkpoint-latest.json"
      - "registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.21.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CIndependentBackendContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CDualBackendPackageContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py"
      - "tools/2026-08-04_validate_g0_three_track_sync_v1.13.py"
      - "tests/2026-08-04_test_g0_three_track_sync_v1.13.py"
      - ".github/workflows/2026-08-03_UniverseLab_G0_ThreeTrackContract_v1.0.yml"

permissions:
  contents: read

jobs:
  validate-g0-background-3c2-state:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt
      - name: Validate canonical JSON artifacts
        run: |
          python -m json.tool project-manifest.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CIndependentBackendContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CDualBackendPackageContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.21.json >/dev/null
          python -m json.tool registry/session-checkpoint-latest.json >/dev/null
      - name: Compile validators and tests
        run: |
          python -m py_compile tools/2026-08-04_validate_g0_three_track_sync_v1.13.py
          python -m py_compile tests/2026-08-04_test_g0_three_track_sync_v1.13.py
          python -m py_compile tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py
      - name: Run canonical G0 v1.13 gate
        run: |
          python tools/2026-08-04_validate_g0_three_track_sync_v1.13.py --json
          python tests/2026-08-04_test_g0_three_track_sync_v1.13.py
      - name: Revalidate dual-backend audit
        run: |
          python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py --json
          python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3c2_v0.1.py
      - name: Verify immutable no-execution and evidence firewalls
        run: |
          test ! -e registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
          grep -q '"release": "2.13-c-phys-m1-background-3c2-dual-backend-audited-v0.1"' project-manifest.json
          grep -q '"BACKGROUND_3C_PRIMARY_IMPLEMENTATION": "PASS_AUDITED_NO_EXECUTION"' project-manifest.json
          grep -q '"BACKGROUND_3C_INDEPENDENT_BACKEND": "PASS_CONTROL_AUDIT_NO_ROOT_SOLVE"' project-manifest.json
          grep -q '"BACKGROUND_3C_DUAL_BACKEND_PACKAGE": "PASS_AUDITED_NO_EXECUTION"' project-manifest.json
          grep -q '"BACKGROUND_3C_EXECUTION": "NOT_AUTHORIZED"' project-manifest.json
          grep -q '"BACKGROUND_SOLVER_IMPLEMENTATION": "DUAL_BACKEND_PRESENT_AUDITED_NO_EXECUTION"' project-manifest.json
          grep -q '"BACKGROUND_SOLVER_EXECUTION": "NOT_AUTHORIZED"' project-manifest.json
          grep -q '"R1.1": "BLOCKED"' project-manifest.json
          grep -q '"R1.2": "BLOCKED"' project-manifest.json
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' project-manifest.json
          grep -q '"FULL_LINEARIZED_BOUNDARY_TRACE_RANK": "NOT_PROVEN"' project-manifest.json
          grep -q '"FREDHOLM_PROPERTY": "NOT_PROVEN"' project-manifest.json
          grep -q '"CONTINUUM_BVP_JACOBIAN": "NOT_PROVEN"' project-manifest.json
          grep -q '"PHYSICAL_BACKGROUND": "NOT_ESTABLISHED"' project-manifest.json
          grep -q '"K1-D": "NOT_RELEASED"' project-manifest.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' project-manifest.json
          grep -q '"physical_evidence_effect": "NONE"' project-manifest.json
          grep -q '"next_block": "C-PHYS-R1.0-BACKGROUND-3C3_EXECUTION_AUTHORIZATION_REVIEW_ONLY"' project-manifest.json
