name: UniverseLab G0 three-track governance contract

on:
  pull_request:
    paths:
      - "project-manifest.json"
      - "registry/decision-log.jsonl"
      - "registry/session-checkpoint-latest.json"
      - "registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.18.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt"
      - "tools/2026-08-04_validate_g0_three_track_sync_v1.10.py"
      - "tests/2026-08-04_test_g0_three_track_sync_v1.10.py"
      - ".github/workflows/2026-08-03_UniverseLab_G0_ThreeTrackContract_v1.0.yml"
  push:
    branches: [main]
    paths:
      - "project-manifest.json"
      - "registry/decision-log.jsonl"
      - "registry/session-checkpoint-latest.json"
      - "registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.18.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json"
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt"
      - "tools/2026-08-04_validate_g0_three_track_sync_v1.10.py"
      - "tests/2026-08-04_test_g0_three_track_sync_v1.10.py"
      - ".github/workflows/2026-08-03_UniverseLab_G0_ThreeTrackContract_v1.0.yml"

permissions:
  contents: read

jobs:
  validate-g0-background-3b-canonical-state:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen Background-3B verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt

      - name: Validate canonical JSON artifacts
        run: |
          python -m json.tool project-manifest.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.18.json >/dev/null
          python -m json.tool registry/session-checkpoint-latest.json >/dev/null

      - name: Compile validators and tests
        run: |
          python -m py_compile tools/2026-08-04_validate_g0_three_track_sync_v1.10.py
          python -m py_compile tests/2026-08-04_test_g0_three_track_sync_v1.10.py
          python -m py_compile tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py

      - name: Run canonical v1.10 gate
        run: |
          python tools/2026-08-04_validate_g0_three_track_sync_v1.10.py --json
          python tests/2026-08-04_test_g0_three_track_sync_v1.10.py

      - name: Revalidate exact Background-3B input contract
        run: |
          python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py --json
          python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py

      - name: Verify immutable no-execution and evidence firewall
        shell: bash
        run: |
          set -euo pipefail
          grep -q '"release": "2.10-c-phys-m1-background-3b-run-input-frozen-v0.1"' project-manifest.json
          grep -q '"BACKGROUND_3B": "RUN_INPUT_FROZEN_EXECUTION_NOT_AUTHORIZED"' project-manifest.json
          grep -q '"BACKGROUND_RUN_INPUT": "FROZEN_CP01"' project-manifest.json
          grep -q '"BACKGROUND_SOLVER_IMPLEMENTATION": "NOT_PRESENT"' project-manifest.json
          grep -q '"BACKGROUND_SOLVER_EXECUTION": "NOT_AUTHORIZED"' project-manifest.json
          grep -q '"R1.1": "BLOCKED"' project-manifest.json
          grep -q '"R1.2": "BLOCKED"' project-manifest.json
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' project-manifest.json
          grep -q '"FULL_LINEARIZED_BOUNDARY_TRACE_RANK": "NOT_PROVEN"' project-manifest.json
          grep -q '"FREDHOLM_PROPERTY": "NOT_PROVEN"' project-manifest.json
          grep -q '"CONTINUUM_BVP_JACOBIAN": "NOT_PROVEN"' project-manifest.json
          grep -q '"PHYSICAL_BACKGROUND": "NOT_ESTABLISHED"' project-manifest.json
          grep -q '"K1-D": "NOT_RELEASED"' project-manifest.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' project-manifest.json
          grep -q '"physical_evidence_effect": "NONE"' project-manifest.json
          grep -q '"next_block": "C-PHYS-R1.0-BACKGROUND-3C_EXECUTION_IMPLEMENTATION_AND_AUTHORIZATION_GATE"' project-manifest.json
