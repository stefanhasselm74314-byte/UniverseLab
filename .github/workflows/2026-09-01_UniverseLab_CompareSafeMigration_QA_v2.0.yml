name: UniverseLab Compare SAFE migration QA v2.0

on:
  pull_request:
    paths:
      - 'compare-safe.html'
      - 'compare-en.html'
      - 'assets/2026-09-01_UniverseLab_CosmologyEngine_v1.0.js'
      - 'assets/2026-09-01_UniverseLab_CompareSafeAdapter_v2.0.js'
      - 'registry/2026-09-01_UniverseLab_CompareSafeMigrationContract_v2.0.json'
      - 'science/cosmology/2026-09-01_UniverseLab_CompareSafeMigration_v2.0.md'
      - 'tests/2026-09-01_test_UniverseLab_CompareSafeMigration_v2.0.py'
      - 'tools/2026-09-01_UniverseLab_CompareSafeMigrationAudit_v2.0.mjs'
      - 'tools/2026-09-01_UniverseLab_CompareSafeFormulaRefreshAudit_v2.0.mjs'
      - '.github/workflows/2026-09-01_UniverseLab_CompareSafeMigration_QA_v2.0.yml'
  push:
    branches: [main]
    paths:
      - 'compare-safe.html'
      - 'compare-en.html'
      - 'assets/2026-09-01_UniverseLab_CosmologyEngine_v1.0.js'
      - 'assets/2026-09-01_UniverseLab_CompareSafeAdapter_v2.0.js'
      - 'registry/2026-09-01_UniverseLab_CompareSafeMigrationContract_v2.0.json'
      - 'science/cosmology/2026-09-01_UniverseLab_CompareSafeMigration_v2.0.md'
      - 'tests/2026-09-01_test_UniverseLab_CompareSafeMigration_v2.0.py'
      - 'tools/2026-09-01_UniverseLab_CompareSafeMigrationAudit_v2.0.mjs'
      - 'tools/2026-09-01_UniverseLab_CompareSafeFormulaRefreshAudit_v2.0.mjs'
      - '.github/workflows/2026-09-01_UniverseLab_CompareSafeMigration_QA_v2.0.yml'

permissions:
  contents: read

jobs:
  validate-compare-safe-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse contract and compile code
        run: |
          python -m json.tool registry/2026-09-01_UniverseLab_CompareSafeMigrationContract_v2.0.json >/dev/null
          python -m py_compile tests/2026-09-01_test_UniverseLab_CompareSafeMigration_v2.0.py
          node --check assets/2026-09-01_UniverseLab_CompareSafeAdapter_v2.0.js
          node --check tools/2026-09-01_UniverseLab_CompareSafeMigrationAudit_v2.0.mjs
          node --check tools/2026-09-01_UniverseLab_CompareSafeFormulaRefreshAudit_v2.0.mjs
      - name: Re-run canonical engine foundation validation
        run: |
          node tools/2026-09-01_validate_UniverseLab_CanonicalCosmologyEngine_v1.0.mjs
          python tests/2026-09-01_test_UniverseLab_CanonicalCosmologyEngine_v1.0.py
      - name: Run static and independent numerical migration contract
        run: python tests/2026-09-01_test_UniverseLab_CompareSafeMigration_v2.0.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local Pages server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/universelab-compare-safe-http.log 2>&1 &
          echo $! >/tmp/universelab-compare-safe-http.pid
          sleep 2
      - name: Run Compare SAFE browser and adversarial audit
        env:
          UNIVERSELAB_BASE_URL: 'http://127.0.0.1:8000/'
        run: node tools/2026-09-01_UniverseLab_CompareSafeMigrationAudit_v2.0.mjs
      - name: Run formula refresh regression audit
        env:
          UNIVERSELAB_BASE_URL: 'http://127.0.0.1:8000/'
        run: node tools/2026-09-01_UniverseLab_CompareSafeFormulaRefreshAudit_v2.0.mjs
      - name: Enforce evidence firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('registry/2026-09-01_UniverseLab_CompareSafeMigrationContract_v2.0.json').read_text())
          assert d['version']=='2.0.1'
          assert d['physical_gate_effect']=='NONE'
          assert d['physical_evidence_effect']=='NONE'
          assert d['observable_firewalls']['bridge_growth']=='UNRELEASED_GROWTH_MAP'
          assert d['observable_firewalls']['bridge_lensing']=='UNRELEASED_LENSING_MAP'
          assert d['background_contract']['invalid_policy']=='FAIL_CLOSED_NO_POSITIVE_FLOOR_OR_HIDDEN_PARAMETER_FLOOR'
          assert d['background_contract']['reference_density_slider_resolution']==0.000001
          assert d['models']['bridge_base_w']==-1
          assert d['models']['bridge_scale_hidden_floor'] is False
          print('Compare SAFE evidence firewall: PASS')
          PY
      - name: Upload Compare SAFE audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universelab-compare-safe-migration-report
          path: compare-safe-migration-report.json
          if-no-files-found: error
