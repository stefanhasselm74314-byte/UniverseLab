name: Research contracts

on:
  pull_request:
    paths:
      - "governance/**"
      - "registry/**"
      - "prompts/**"
      - "science/**"
      - "*.html"
      - "*.json"
      - "*.md"
      - "tools/verify_md2s_recovery_package_v0_1.py"
      - "tools/hzt_m0_overlap_bridge_v0_1.py"
      - "tools/hzt_m0_spectral_bridge_v0_1.py"
      - "tools/hzt_m0_warp_volume_bridge_v0_1.py"
      - "tools/2026-08-03_validate_public_repository_privacy_v1.0.py"
      - "tests/test_verify_md2s_recovery_package_v0_1.py"
      - "tests/test_hzt_m0_overlap_bridge_v0_1.py"
      - "tests/test_hzt_m0_spectral_bridge_v0_1.py"
      - "tests/test_hzt_m0_warp_volume_bridge_v0_1.py"
      - "tests/2026-08-03_test_public_repository_privacy_v1.0.py"
      - ".github/workflows/research-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "governance/**"
      - "registry/**"
      - "prompts/**"
      - "science/**"
      - "*.html"
      - "*.json"
      - "*.md"
      - "tools/verify_md2s_recovery_package_v0_1.py"
      - "tools/hzt_m0_overlap_bridge_v0_1.py"
      - "tools/hzt_m0_spectral_bridge_v0_1.py"
      - "tools/hzt_m0_warp_volume_bridge_v0_1.py"
      - "tools/2026-08-03_validate_public_repository_privacy_v1.0.py"
      - "tests/test_verify_md2s_recovery_package_v0_1.py"
      - "tests/test_hzt_m0_overlap_bridge_v0_1.py"
      - "tests/test_hzt_m0_spectral_bridge_v0_1.py"
      - "tests/test_hzt_m0_warp_volume_bridge_v0_1.py"
      - "tests/2026-08-03_test_public_repository_privacy_v1.0.py"
      - ".github/workflows/research-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile tools/verify_md2s_recovery_package_v0_1.py
          python -m py_compile tools/hzt_m0_overlap_bridge_v0_1.py
          python -m py_compile tools/hzt_m0_spectral_bridge_v0_1.py
          python -m py_compile tools/hzt_m0_warp_volume_bridge_v0_1.py
          python -m py_compile tools/2026-08-03_validate_public_repository_privacy_v1.0.py
          python -m py_compile tests/test_verify_md2s_recovery_package_v0_1.py
          python -m py_compile tests/test_hzt_m0_overlap_bridge_v0_1.py
          python -m py_compile tests/test_hzt_m0_spectral_bridge_v0_1.py
          python -m py_compile tests/test_hzt_m0_warp_volume_bridge_v0_1.py
          python -m py_compile tests/2026-08-03_test_public_repository_privacy_v1.0.py

      - name: Validate JSON registries
        run: |
          python -m json.tool registry/chat-source-register-v0.1.json >/dev/null
          python -m json.tool registry/source-intake-2026-08-01-batch02.json >/dev/null
          python -m json.tool registry/source-intake-2026-08-01-batch03-md2nq.json >/dev/null
          python -m json.tool registry/forensic-attachment-recovery-targets-v0.1.json >/dev/null
          python -m json.tool registry/claim-register-v0.1.json >/dev/null
          python -m json.tool registry/claim-register-v0.1-mds05-addendum.json >/dev/null
          python -m json.tool registry/research-continuation-manifest-v0.1.json >/dev/null
          python -m json.tool registry/research-continuation-manifest-v0.1-mds05-addendum.json >/dev/null
          python -m json.tool registry/mds05-warp-volume-contract-v0.1.json >/dev/null
          python -m json.tool registry/2026-08-03_UniverseLab_PublicPrivacyContract_v1.0.json >/dev/null
          python -m json.tool registry/2026-08-03_UniverseLab_PublicPrivacyDecision_v1.0.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R0_ARTIFACT_INVENTORY_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R1_MODEL_FREEZE_GATE_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R1_SOURCE_RECONSTRUCTION_LEDGER_v0.1.json >/dev/null

      - name: Public repository privacy gate
        run: python tools/2026-08-03_validate_public_repository_privacy_v1.0.py .

      - name: Check required research audit files
        run: |
          test -f science/hzt-m0/bridge/MD2F_H_I_INTEGRATION_AUDIT_v0.1.md
          test -f science/hzt-m0/bridge/MD2N_Q_PACKAGE_RIGOR_AUDIT_v0.1.md
          test -f science/hzt-m0/bridge/MD2P_CORR_OVERLAP_DERIVATION_v0.1.md
          test -f science/hzt-m0/bridge/MD2I_MDS01_SPECTRAL_BRIDGE_DERIVATION_v0.1.md
          test -f science/hzt-m0/bridge/MD2I_MDS05_WARP_VOLUME_BRIDGE_DERIVATION_v0.1.md
          test -f science/gw/GW_FALSIFICATION_DOSSIER_RIGOR_AUDIT_v0.1.md

      - name: Run research contract tests
        run: |
          python -m unittest -v tests/test_verify_md2s_recovery_package_v0_1.py
          python -m unittest -v tests/test_hzt_m0_overlap_bridge_v0_1.py
          python -m unittest -v tests/test_hzt_m0_spectral_bridge_v0_1.py
          python -m unittest -v tests/test_hzt_m0_warp_volume_bridge_v0_1.py
          python tests/2026-08-03_test_public_repository_privacy_v1.0.py -v
