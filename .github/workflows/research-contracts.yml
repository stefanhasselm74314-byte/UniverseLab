name: Research contracts

on:
  pull_request:
    paths:
      - "governance/**"
      - "registry/**"
      - "science/hzt-m0/md2s/**"
      - "science/hzt-m0/bridge/**"
      - "science/gw/**"
      - "tools/verify_md2s_recovery_package_v0_1.py"
      - "tests/test_verify_md2s_recovery_package_v0_1.py"
      - ".github/workflows/research-contracts.yml"
  push:
    branches:
      - main
    paths:
      - "governance/**"
      - "registry/**"
      - "science/hzt-m0/md2s/**"
      - "science/hzt-m0/bridge/**"
      - "science/gw/**"
      - "tools/verify_md2s_recovery_package_v0_1.py"
      - "tests/test_verify_md2s_recovery_package_v0_1.py"
      - ".github/workflows/research-contracts.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python
        run: |
          python -m py_compile tools/verify_md2s_recovery_package_v0_1.py
          python -m py_compile tests/test_verify_md2s_recovery_package_v0_1.py

      - name: Validate JSON registries
        run: |
          python -m json.tool registry/chat-source-register-v0.1.json >/dev/null
          python -m json.tool registry/source-intake-2026-08-01-batch02.json >/dev/null
          python -m json.tool registry/claim-register-v0.1.json >/dev/null
          python -m json.tool registry/research-continuation-manifest-v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R0_ARTIFACT_INVENTORY_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R1_MODEL_FREEZE_GATE_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/R1_SOURCE_RECONSTRUCTION_LEDGER_v0.1.json >/dev/null

      - name: Check required research audit files
        run: |
          test -f science/hzt-m0/bridge/MD2F_H_I_INTEGRATION_AUDIT_v0.1.md
          test -f science/gw/GW_FALSIFICATION_DOSSIER_RIGOR_AUDIT_v0.1.md

      - name: Run MD-2S verifier tests
        run: python -m unittest -v tests/test_verify_md2s_recovery_package_v0_1.py