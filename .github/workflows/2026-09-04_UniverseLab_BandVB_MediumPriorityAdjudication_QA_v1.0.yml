name: UniverseLab Band V-B priority MEDIUM adjudication QA v1.0

on:
  pull_request:
    paths:
      - 'registry/2026-09-04_UniverseLab_PublicScientificMediumPriorityAdjudication_v1.0.json'
      - 'tests/2026-09-04_test_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.py'
      - 'science/audit/2026-09-04_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.md'
      - 'registry/2026-09-03_UniverseLab_PublicScientificClaimLexicalCandidates_v0.1.json'
      - 'registry/2026-09-03_UniverseLab_PublicScientificClaimFamilyAssignments_v0.1.json'
      - 'tools/2026-09-03_extract_UniverseLab_PublicScientificClaims_v1.0.py'
      - 'legacy.html'
      - 'hyperzeit-methods.html'
      - 'guide-en.html'
      - 'hyperzeit-methods-en.html'
      - 'hyperzeit-material-v2-en.html'
      - 'hyperzeit-material-v2.html'
      - 'navigator.html'
      - 'research-status-en.html'
      - '.github/workflows/2026-09-04_UniverseLab_BandVB_MediumPriorityAdjudication_QA_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'registry/2026-09-04_UniverseLab_PublicScientificMediumPriorityAdjudication_v1.0.json'
      - 'tests/2026-09-04_test_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.py'
      - 'science/audit/2026-09-04_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.md'
      - 'registry/2026-09-03_UniverseLab_PublicScientificClaimLexicalCandidates_v0.1.json'
      - 'registry/2026-09-03_UniverseLab_PublicScientificClaimFamilyAssignments_v0.1.json'
      - 'tools/2026-09-03_extract_UniverseLab_PublicScientificClaims_v1.0.py'
      - 'legacy.html'
      - 'hyperzeit-methods.html'
      - 'guide-en.html'
      - 'hyperzeit-methods-en.html'
      - 'hyperzeit-material-v2-en.html'
      - 'hyperzeit-material-v2.html'
      - 'navigator.html'
      - 'research-status-en.html'
      - '.github/workflows/2026-09-04_UniverseLab_BandVB_MediumPriorityAdjudication_QA_v1.0.yml'

permissions:
  contents: read

jobs:
  validate-priority-medium-adjudication:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse adjudication ledger
        run: |
          python -m json.tool registry/2026-09-04_UniverseLab_PublicScientificMediumPriorityAdjudication_v1.0.json >/dev/null
          python -m json.tool registry/2026-09-03_UniverseLab_PublicScientificClaimLexicalCandidates_v0.1.json >/dev/null
          python -m json.tool registry/2026-09-03_UniverseLab_PublicScientificClaimFamilyAssignments_v0.1.json >/dev/null

      - name: Compile gate
        run: |
          python -m py_compile tools/2026-09-03_extract_UniverseLab_PublicScientificClaims_v1.0.py
          python -m py_compile tests/2026-09-04_test_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.py

      - name: Run priority MEDIUM contextual adjudication gate
        run: python tests/2026-09-04_test_UniverseLab_BandVB_MediumPriorityAdjudication_v1.0.py

      - name: Emit nonoperative MEDIUM-priority report
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          ledger=json.loads(Path('registry/2026-09-04_UniverseLab_PublicScientificMediumPriorityAdjudication_v1.0.json').read_text())
          report={
            'schema':'universelab.band-vb-medium-priority-gate-report.v1',
            'status':'PASS_PRIORITY_MEDIUM_CONTEXT_ADJUDICATED',
            'priority_medium_candidates':ledger['global_result']['priority_medium_candidates'],
            'contextually_adjudicated':ledger['global_result']['contextually_adjudicated'],
            'positive_physical_hzt_overclaims':ledger['global_result']['positive_physical_hzt_overclaims'],
            'physical_claim_promotions':ledger['global_result']['physical_claim_promotions'],
            'remaining_lower_score_medium_candidates':ledger['global_result']['remaining_materialized_medium_candidates_before_lower_score_review'],
            'physical_gate_effect':'NONE',
            'physical_evidence_effect':'NONE',
          }
          assert report['priority_medium_candidates']==9
          assert report['contextually_adjudicated']==9
          assert report['positive_physical_hzt_overclaims']==0
          assert report['physical_claim_promotions']==0
          Path('band-vb-medium-priority-gate-report.json').write_text(json.dumps(report,sort_keys=True,indent=2)+'\n')
          print(json.dumps(report,sort_keys=True,indent=2))
          PY

      - name: Upload nonoperative MEDIUM-priority report
        uses: actions/upload-artifact@v4
        with:
          name: universelab-band-vb-medium-priority-gate-report
          path: band-vb-medium-priority-gate-report.json
          if-no-files-found: error
