name: HZT-M0-S6-C1-V G1.1 symmetric predictor

on:
  pull_request:
    paths:
      - "registry/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictorContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictorLedger_v0.1.md"
      - "tools/2026-08-03_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py"
      - "tests/2026-08-03_test_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py"
      - "tools/2026-08-03_md2s_c1_dimensionless_jacobian_v0.1.py"
      - "tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py"
      - ".github/workflows/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictorContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictorLedger_v0.1.md"
      - "tools/2026-08-03_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py"
      - "tests/2026-08-03_test_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py"
      - "tools/2026-08-03_md2s_c1_dimensionless_jacobian_v0.1.py"
      - "tools/2026-08-03_md2s_c1_independent_backend_continuation_v0.1.py"
      - ".github/workflows/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_v0.1.yml"

permissions:
  contents: read

jobs:
  execute-preregistered-g1-1:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate preregistration JSON
        run: python -m json.tool registry/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictorContract_v0.1.json >/dev/null

      - name: Compile evaluator and tests
        run: |
          python -m py_compile tools/2026-08-03_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py
          python -m py_compile tests/2026-08-03_test_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py

      - name: Run contract tests
        run: python tests/2026-08-03_test_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py

      - name: Execute preregistered predictor-only diagnostic
        run: |
          mkdir -p artifacts
          python tools/2026-08-03_hzt_m0_s6_c1_v_g1_1_symmetric_predictor_v0.1.py \
            --output artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.json \
            > artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.stdout.json

      - name: Print diagnostic summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.json")
          data = json.loads(path.read_text())
          print("RUN_ID =", data["run_id"])
          print("STATUS =", data["status"])
          print("RESULT_STATUS =", data["result_status"])
          print("PREREGISTRATION_HASH =", data["preregistration_hash"])
          print("CODE_HASH =", data["code_hash"])
          print("REFERENCE_CODE_HASH =", data["reference_code_hash"])
          print("INDEPENDENT_CODE_HASH =", data["independent_code_hash"])
          print("TANGENT_RELATIVE_DIFFERENCE =", data["tangent_checks"]["relative_tangent_difference"])
          print("LINEAR_CLOSURE_INFINITY_NORM =", data["tangent_checks"]["linear_closure_infinity_norm"])
          for item in data["fit_analyses"]:
              print(
                  "FIT",
                  item["backend"],
                  item["resolution"],
                  item["sign"],
                  "slope=", item["slope"],
                  "ratios=", item["halving_ratios"],
                  "pass=", item["pass"],
              )
          for key, value in data["checks"].items():
              print("CHECK", key, "=", value)
          print("C1-V3 =", data["gate_state"]["C1-V3"])
          print("K1-D =", data["gate_state"]["K1-D"])
          print("K1-E =", data["gate_state"]["K1-E"])
          print("PHYSICAL_EVIDENCE_EFFECT =", data["gate_state"]["physical_evidence_effect"])
          PY

      - name: Enforce execution firewall
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.json").read_text())
          assert data["nonlinear_corrector_implemented"] is False
          assert data["root_solver_implemented"] is False
          assert data["branch_tracking_implemented"] is False
          assert data["second_derivative_computed"] is False
          assert data["gate_state"]["C1-V3"] == "PARTIAL"
          assert data["gate_state"]["C1-V4"] == "NOT_STARTED"
          assert data["gate_state"]["R1.1"] == "BLOCKED"
          assert data["gate_state"]["official_MD2S_solver"] == "NOT_AUTHORIZED"
          assert data["gate_state"]["K1-D"] == "NOT_RELEASED"
          assert data["gate_state"]["K1-E"] == "NOT_ADMISSIBLE"
          assert data["gate_state"]["physical_evidence_effect"] == "NONE"
          PY

      - name: Upload diagnostic run artifact
        uses: actions/upload-artifact@v4
        with:
          name: 2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1
          path: |
            artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.json
            artifacts/2026-08-03_HZT_M0_S6_C1_V_G1_1_SymmetricPredictor_Run_v0.1.stdout.json
          if-no-files-found: error
          retention-days: 30
