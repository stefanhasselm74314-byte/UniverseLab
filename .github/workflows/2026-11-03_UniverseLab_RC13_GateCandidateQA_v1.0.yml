name: UniverseLab RC13 candidate self-test (not trusted enforcement)
on:
  pull_request:
    paths:
      - '.github/workflows/2026-11-03_UniverseLab_RC13_TrustedReleaseGate_v1.0.yml'
      - '.github/workflows/2026-11-03_UniverseLab_RC13_GateCandidateQA_v1.0.yml'
      - 'tools/2026-11-03_UniverseLab_RC13_TrustedReleaseGuard_v1.0.py'
      - 'tests/2026-11-03_test_UniverseLab_RC13_TrustedReleaseGuard_v1.0.py'
      - 'governance/2026-11-03_UniverseLab_RC13_TrustedReleaseGateBootstrap_v1.0.md'
permissions:
  contents: read
jobs:
  rc13-candidate-selftest:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Syntax checks
        run: |
          python3 -m py_compile tools/2026-11-03_UniverseLab_RC13_TrustedReleaseGuard_v1.0.py
          python3 -m py_compile tests/2026-11-03_test_UniverseLab_RC13_TrustedReleaseGuard_v1.0.py
      - name: Positive and negative tests with mocked REST
        run: python3 tests/2026-11-03_test_UniverseLab_RC13_TrustedReleaseGuard_v1.0.py -v
      - name: No repository mutations
        run: |
          git diff --quiet
          git diff --cached --quiet
      - name: Document candidate-only conclusion
        run: |
          echo 'Candidate self-tests are PR-controlled and are NOT protected gate enforcement.' >> "$GITHUB_STEP_SUMMARY"
          echo 'A future base-trusted workflow on main plus active required-check rules is necessary.' >> "$GITHUB_STEP_SUMMARY"
