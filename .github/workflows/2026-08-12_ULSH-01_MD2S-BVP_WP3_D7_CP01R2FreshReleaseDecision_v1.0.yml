name: ULSH-01 WP3-D7 CP01R2 fresh release decision no-execution

on:
  pull_request:
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d7_cp01r2_fresh_release_decision_v1.0.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionLedger_v1.0.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.json'
      - 'tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d7_cp01r2_fresh_release_decision_v1.0.py'
      - 'tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionTest_v1.0.py'
      - 'science/hzt-m0/md2s/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionLedger_v1.0.md'
      - '.github/workflows/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.yml'

permissions:
  contents: read

jobs:
  decision-review:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact decision source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate decision JSON
        run: python -m json.tool registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.json >/dev/null
      - name: Compile decision validator and test
        run: |
          python -m py_compile tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d7_cp01r2_fresh_release_decision_v1.0.py
          python -m py_compile tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionTest_v1.0.py
      - name: Validate fresh release decision
        run: python tools/2026-08-12_ulsh_01_md2s_bvp_wp3_d7_cp01r2_fresh_release_decision_v1.0.py
      - name: Run no-execution regression
        run: python tests/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecisionTest_v1.0.py
      - name: Hard no-execution and no-issuance firewall
        shell: bash
        run: |
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6H1_CP01R2_PhysicalSolveReleaseAuthorization_v2.0.json
          test ! -e registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D6H1_CP01R2_SingleUseExecutionGrant_v2.0.json
          ! grep -R --line-number --fixed-strings 'physical_solve_executed": true' registry/2026-08-12_ULSH-01_MD2S-BVP_WP3_D7_CP01R2FreshReleaseDecision_v1.0.json
