name: UniverseLab one-shot platform rollout migration v1.0

on:
  push:
    branches:
      - 2026-08-16-platform-rollout-v1

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout rollout branch
        uses: actions/checkout@v4
        with:
          ref: 2026-08-16-platform-rollout-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply governed rollout
        run: |
          python tools/2026-08-16_apply_universelab_platform_rollout_v1.0.py
          python tools/2026-08-16_apply_universelab_platform_rollout_v1.0.py --check

      - name: Commit rollout result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            navigator.html \
            hyperlab.html \
            solver-hub.html \
            hyperzeit-material-v2.html \
            hyperzeit-methods.html \
            universelab-audit-2026-07-31.html \
            source.html \
            project-manifest.json
          if git diff --cached --quiet; then
            echo "No rollout changes required."
          else
            git commit -m "feat(platform): apply P6 manifest sync and global shell rollout"
            git push origin HEAD:2026-08-16-platform-rollout-v1
          fi
