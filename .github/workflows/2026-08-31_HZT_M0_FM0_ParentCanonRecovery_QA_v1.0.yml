name: HZT-M0 FM-0 Parent/Canon Recovery QA v1.0

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fm0-parent-canon-recovery:
    name: FM-0 parent/canon recovery fail-closed QA
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate FM-0 recovery state
        run: python tools/2026-08-31_validate_hzt_m0_fm0_parent_canon_recovery_v1.0.py
