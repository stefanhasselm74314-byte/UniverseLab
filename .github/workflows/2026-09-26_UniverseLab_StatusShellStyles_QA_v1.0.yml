name: UniverseLab status shell stylesheet QA v1.0

on:
  pull_request:
    paths:
      - 'research-status.html'
      - 'research-status-en.html'
      - 'assets/2026-08-16_UniverseLab_GlobalShell_v1.1.*'
      - 'assets/2026-08-01_UniverseLab_MobileTypography_v1.1.css'
      - 'assets/2026-08-30_UniverseLab_SiteLanguageSwitcher_v1.0.js'
      - '2026-08-19_UniverseLab_SitePrintExportServiceWorker_v1.0.js'
      - 'tests/2026-09-26_test_UniverseLab_StatusShellStyles_v1.0.py'
      - '.github/workflows/2026-09-26_UniverseLab_StatusShellStyles_QA_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'research-status.html'
      - 'research-status-en.html'
      - 'assets/2026-08-16_UniverseLab_GlobalShell_v1.1.*'
      - 'tests/2026-09-26_test_UniverseLab_StatusShellStyles_v1.0.py'
      - '.github/workflows/2026-09-26_UniverseLab_StatusShellStyles_QA_v1.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status-shell:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Bind checked-out source
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          mkdir -p web50-status-shell-report
          git rev-parse HEAD > web50-status-shell-report/source-sha.txt
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing shell-QA browser version
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Serve branch under Pages path
        run: |
          mkdir -p /tmp/web50-status-root
          ln -s "$GITHUB_WORKSPACE" /tmp/web50-status-root/UniverseLab
          python -m http.server 4173 --bind 127.0.0.1 --directory /tmp/web50-status-root >/tmp/web50-status-http.log 2>&1 &
          sleep 2
      - name: Check dependency, rendered shell and controlled-client parity
        run: python tests/2026-09-26_test_UniverseLab_StatusShellStyles_v1.0.py --browser
      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web50-status-shell-styles
          path: web50-status-shell-report/
          if-no-files-found: error
