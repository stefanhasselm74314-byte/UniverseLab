name: HZT-M0-S6 C-PHYS-M1 Background-3A topology correction

on:
  pull_request:
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionContract_v0.2.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionLedger_v0.2.md"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrection_v0.2.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionContract_v0.2.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionLedger_v0.2.md"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrection_v0.2.yml"

permissions:
  contents: read

jobs:
  validate-background-3a-topology-correction:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate correction JSON
        run: python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionContract_v0.2.json >/dev/null

      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py

      - name: Run fail-closed topology validator
        run: python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py --json

      - name: Run negative regression tests
        run: python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3a_topology_v0.2.py

      - name: Enforce single-cap-phase and evidence firewalls
        shell: bash
        run: |
          set -euo pipefail
          FILE=registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3ATopologyCorrectionContract_v0.2.json
          grep -q '"N_F"' "$FILE"
          grep -q '"N_sigma"' "$FILE"
          grep -q '"m_sigma"' "$FILE"
          grep -q '"count": 3' "$FILE"
          grep -q '"exact_run_input_frozen": false' "$FILE"
          grep -q '"current_execution": "NOT_EXECUTED"' "$FILE"
          grep -q '"solver_authorized": false' "$FILE"
          grep -q '"R1.1": "BLOCKED"' "$FILE"
          grep -q '"R1.2": "BLOCKED"' "$FILE"
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' "$FILE"
          grep -q '"K1-D": "NOT_RELEASED"' "$FILE"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$FILE"
          grep -q '"physical_evidence_effect": "NONE"' "$FILE"
