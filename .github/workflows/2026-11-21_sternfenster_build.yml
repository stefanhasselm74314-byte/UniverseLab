name: Sternfenster Android APK (isoliertes Projekt)
on:
  push:
    branches: ['feature/sternfenster-v0.1']
    paths:
      - 'sky-widget/**'
      - '.github/workflows/2026-11-21_sternfenster_build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install SDK Platform 35
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}" >> "$GITHUB_ENV"
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Full public-domain Yale bright-star catalogue
        run: |
          mkdir -p sky-widget/app/src/main/assets
          curl -fsSL --retry 3 https://raw.githubusercontent.com/isene/starmap/master/data/stars.csv -o sky-widget/app/src/main/assets/stars.csv
          test $(wc -l < sky-widget/app/src/main/assets/stars.csv) -ge 9000
      - name: Build debug APK
        working-directory: sky-widget
        run: gradle --no-daemon assembleDebug
      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Sternfenster-Android-0.1.0-APK
          path: sky-widget/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
