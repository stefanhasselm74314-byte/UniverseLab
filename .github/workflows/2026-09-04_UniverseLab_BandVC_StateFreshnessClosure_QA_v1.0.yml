name: UniverseLab Band V-C G11 state freshness closure QA v1.0

on:
  pull_request:
    paths:
      - 'registry/2026-09-04_UniverseLab_CurrentMainCanonicalState_v1.3.json'
      - 'registry/2026-09-04_UniverseLab_SiteState_v1.4.json'
      - 'registry/2026-09-04_UniverseLab_SessionCheckpoint_v1.34.json'
      - 'registry/session-checkpoint-latest.json'
      - 'registry/2026-09-04_UniverseLab_BandVC_G11_StateFreshnessClosure_v1.0.json'
      - 'project-manifest.json'
      - 'assets/2026-08-16_UniverseLab_GlobalShell_v1.1.js'
      - 'research-status.html'
      - 'research-status-en.html'
      - 'tests/2026-09-04_test_UniverseLab_BandVC_StateFreshnessClosure_v1.0.py'
      - '.github/workflows/2026-09-04_UniverseLab_BandVC_StateFreshnessClosure_QA_v1.0.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-state-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Parse successor chain
        run: |
          python -m json.tool registry/2026-09-04_UniverseLab_CurrentMainCanonicalState_v1.3.json >/dev/null
          python -m json.tool registry/2026-09-04_UniverseLab_SiteState_v1.4.json >/dev/null
          python -m json.tool registry/2026-09-04_UniverseLab_SessionCheckpoint_v1.34.json >/dev/null
          python -m json.tool registry/session-checkpoint-latest.json >/dev/null
          python -m json.tool registry/2026-09-04_UniverseLab_BandVC_G11_StateFreshnessClosure_v1.0.json >/dev/null
          python -m json.tool project-manifest.json >/dev/null

      - name: Run existing current-state validator strict
        run: |
          python tools/2026-09-01_validate_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py --strict-source-existence

      - name: Run existing adversarial pointer regression suite
        run: |
          python tests/2026-09-01_test_UniverseLab_CurrentMainCanonicalStateReconciliation_v1.0.py

      - name: Run Band V-C G11 closure gate
        run: |
          python tests/2026-09-04_test_UniverseLab_BandVC_StateFreshnessClosure_v1.0.py

      - name: Enforce nonoperative firewalls
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          m=json.loads(Path('project-manifest.json').read_text(encoding='utf-8'))
          expected={
            'FM-G0':'OPEN','RATIFIED_HUMAN_TRUST_ROOT':'NOT_RATIFIED',
            'RUNTIME_ISSUANCE_BINDINGS':'BLOCKED','AuthorizationDecision':'NOT_CREATED',
            'SingleUseGrant':'NOT_CREATED','BACKEND_IMPORT':'NOT_EXECUTED',
            'SOLVER_EXECUTION':'NOT_EXECUTED','PHYSICAL_BACKGROUND':'NOT_ESTABLISHED',
            'PHYSICAL_RESPONSE_RANK':'NOT_EXECUTED','K1-D':'NOT_RELEASED','K1-E':'NOT_ADMISSIBLE'
          }
          for k,v in expected.items(): assert m['gates'][k]==v,(k,m['gates'][k],v)
          assert m['physical_gate_effect']=='NONE'
          assert m['physical_evidence_effect']=='NONE'
          print('Band V-C G11 nonoperative firewall: PASS')
          PY
