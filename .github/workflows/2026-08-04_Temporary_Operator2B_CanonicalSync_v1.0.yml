name: Temporary Operator-2B canonical synchronization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  synchronize:
    if: ${{ github.head_ref == 'agent/operator2b-canonical-sync-run' && !contains(github.event.pull_request.title, '[SYNC COMPLETE]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply canonical synchronization
        run: python tools/2026-08-04_apply_operator2b_canonical_sync_v1.0.py
      - name: Commit synchronized state and remove non-workflow temporary files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'UniverseLab Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add project-manifest.json registry/decision-log.jsonl registry/session-checkpoint-latest.json registry/2026-08-04_UniverseLab_SessionCheckpoint_v1.15.json
          git rm tools/2026-08-04_apply_operator2b_canonical_sync_v1.0.py
          if [ -f registry/2026-08-04_Operator2B_CanonicalSyncTrigger_v0.1.txt ]; then
            git rm registry/2026-08-04_Operator2B_CanonicalSyncTrigger_v0.1.txt
          fi
          git commit -m '[operator2b-sync] Canonicalize Operator-2B state'
          git push origin HEAD:${{ github.head_ref }}
