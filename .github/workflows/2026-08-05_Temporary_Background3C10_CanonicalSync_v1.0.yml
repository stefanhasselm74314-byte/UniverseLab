name: Temporary Background-3C10 canonical synchronization

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read

jobs:
  synchronize:
    if: ${{ github.head_ref == 'agent/background-3c10-status-sync-v1-0' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply Background-3C10 canonical synchronization
        run: python tools/2026-08-05_apply_background3c10_canonical_sync_v1.0.py
      - name: Validate synchronized files
        run: |
          python -m json.tool project-manifest.json >/dev/null
          python -m json.tool registry/session-checkpoint-latest.json >/dev/null
          python -m json.tool registry/2026-08-05_UniverseLab_SessionCheckpoint_v1.29.json >/dev/null
          cmp registry/session-checkpoint-latest.json registry/2026-08-05_UniverseLab_SessionCheckpoint_v1.29.json
          python - <<'PY'
          import json
          from pathlib import Path
          decisions = [json.loads(line) for line in Path('registry/decision-log.jsonl').read_text(encoding='utf-8').splitlines() if line.strip()]
          selected = [item for item in decisions if item.get('decision_id') == 'UL-DEC-0036']
          assert len(selected) == 1
          assert selected[0]['physical_evidence_effect'] == 'NONE'
          PY
      - name: Commit canonical state and remove temporary script
        run: |
          git config user.name 'UniverseLab Sync Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add project-manifest.json registry/decision-log.jsonl registry/session-checkpoint-latest.json registry/2026-08-05_UniverseLab_SessionCheckpoint_v1.29.json
          git rm tools/2026-08-05_apply_background3c10_canonical_sync_v1.0.py
          git commit -m '[background3c10-sync] Canonicalize audited R3 real-backend controls'
          git push origin HEAD:${{ github.head_ref }}
