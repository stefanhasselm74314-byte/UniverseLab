name: UniverseLab ClockDeck Android v0.2 - layout repairs
on:
  pull_request:
    paths:
      - 'clockdeck-build/**'
      - '.github/workflows/2026-11-20_UniverseLab_ClockDeckAndroidBuild_v0.2.yml'
  workflow_dispatch:
permissions: { contents: read }
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install 'Pillow==11.3.0'
      - name: Materialize dated sources
        run: python clockdeck-build/2026-11-20_UL_ClockDeck_Materialize_v0.2.py
      - name: Verify layout and XML contracts
        run: python -m unittest discover -s build_clockdeck/tests -v
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v4
      - run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Build debug APK
        run: gradle -p build_clockdeck :app:assembleDebug --no-daemon --stacktrace
      - name: Check manifest and package
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging build_clockdeck/app/build/outputs/apk/debug/app-debug.apk | grep -E "^package:|^sdkVersion:|^targetSdkVersion:"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify build_clockdeck/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: UniverseLab-ClockDeck-Android-v0.2-Fix
          path: build_clockdeck/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
