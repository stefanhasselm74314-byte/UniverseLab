name: UniverseLab comparison route consolidation QA v1.0

on:
  pull_request:
    paths:
      - 'compare.html'
      - 'compare-direct.html'
      - 'compare-app.js'
      - 'compare-safe.html'
      - 'assets/2026-09-01_UniverseLab_CompareSafeAdapter_v2.0.js'
      - 'registry/2026-09-01_UniverseLab_CompareRouteConsolidationContract_v1.0.json'
      - 'tests/2026-09-01_test_UniverseLab_CompareRouteConsolidation_v1.0.py'
      - 'tools/2026-09-01_UniverseLab_CompareRouteConsolidationAudit_v1.0.mjs'
      - '.github/workflows/2026-09-01_UniverseLab_CompareRouteConsolidation_QA_v1.0.yml'
  push:
    branches: [main]
    paths:
      - 'compare.html'
      - 'compare-direct.html'
      - 'compare-app.js'
      - 'compare-safe.html'
      - 'assets/2026-09-01_UniverseLab_CompareSafeAdapter_v2.0.js'
      - 'registry/2026-09-01_UniverseLab_CompareRouteConsolidationContract_v1.0.json'
      - 'tests/2026-09-01_test_UniverseLab_CompareRouteConsolidation_v1.0.py'
      - 'tools/2026-09-01_UniverseLab_CompareRouteConsolidationAudit_v1.0.mjs'
      - '.github/workflows/2026-09-01_UniverseLab_CompareRouteConsolidation_QA_v1.0.yml'

permissions:
  contents: read

jobs:
  validate-route-consolidation:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Parse contract and compile tests
        run: |
          python -m json.tool registry/2026-09-01_UniverseLab_CompareRouteConsolidationContract_v1.0.json >/dev/null
          python -m py_compile tests/2026-09-01_test_UniverseLab_CompareRouteConsolidation_v1.0.py
          node --check compare-app.js
          node --check tools/2026-09-01_UniverseLab_CompareRouteConsolidationAudit_v1.0.mjs
      - name: Run static retirement contract
        run: python tests/2026-09-01_test_UniverseLab_CompareRouteConsolidation_v1.0.py
      - name: Re-run canonical comparison and engine contracts
        run: |
          node tools/2026-09-01_validate_UniverseLab_CanonicalCosmologyEngine_v1.0.mjs
          python tests/2026-09-01_test_UniverseLab_CanonicalCosmologyEngine_v1.0.py
          python tests/2026-09-01_test_UniverseLab_CompareSafeMigration_v2.0.py
      - name: Install Playwright Chromium
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Start local Pages server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 >/tmp/universelab-compare-route-http.log 2>&1 &
          echo $! >/tmp/universelab-compare-route-http.pid
          sleep 2
      - name: Run redirect and retirement browser audit
        env:
          UNIVERSELAB_BASE_URL: 'http://127.0.0.1:8000/'
        run: node tools/2026-09-01_UniverseLab_CompareRouteConsolidationAudit_v1.0.mjs
      - name: Enforce no physical promotion
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('registry/2026-09-01_UniverseLab_CompareRouteConsolidationContract_v1.0.json').read_text())
          assert d['physical_gate_effect']=='NONE'
          assert d['physical_evidence_effect']=='NONE'
          assert d['compatibility_api']['numerical_functions']==0
          assert d['canonical_executable_route']=='compare-safe.html'
          print('Comparison route consolidation firewall: PASS')
          PY
      - name: Upload consolidation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: universelab-compare-route-consolidation-report
          path: compare-route-consolidation-report.json
          if-no-files-found: error
