name: Sternfenster 0.2.1 Android runtime regression

on:
  push:
    branches: ['fix/sternfenster-native-sky-v0.2']
    paths:
      - 'sky-widget/**'
      - '.github/workflows/2026-11-21_sternfenster_runtime_v021.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          # The historical "tools" package is no longer offered by sdkmanager.
          packages: ''
          log-accepted-android-sdk-licenses: false

      - name: Install compiler SDK
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build known-broken baseline and candidate unsigned
        run: |
          mkdir -p "$RUNNER_TEMP/sternfenster-baseline"
          git fetch --depth=1 origin a78b1c3385bade6e7de7cf18ce7d0ba6d9f85204
          git archive a78b1c3385bade6e7de7cf18ce7d0ba6d9f85204 sky-widget | tar -x -C "$RUNNER_TEMP/sternfenster-baseline"
          python3 "$RUNNER_TEMP/sternfenster-baseline/sky-widget/tools/build_local.py" --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/baseline.apk"
          python3 sky-widget/tools/build_local.py --sdk "$ANDROID_HOME" --output "$RUNNER_TEMP/candidate.apk"

      - name: Sign both APKs with a disposable CI key
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/runtime-test.p12" -storetype PKCS12 -storepass android -keypass android -alias runtime -keyalg RSA -keysize 2048 -validity 1 -dname "CN=Disposable Android Runtime Test"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/runtime-test.p12" --ks-key-alias runtime --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/baseline-signed.apk" "$RUNNER_TEMP/baseline-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/runtime-test.p12" --ks-key-alias runtime --ks-pass pass:android --key-pass pass:android --out "$RUNNER_TEMP/candidate-signed.apk" "$RUNNER_TEMP/candidate-UNSIGNED.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/baseline-signed.apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$RUNNER_TEMP/candidate-signed.apk"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Reproduce crash and exercise the fixed native UI on API 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          disable-spellchecker: true
          emulator-boot-timeout: 600
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 sky-widget/tools/runtime_smoke.py --baseline "$RUNNER_TEMP/baseline-signed.apk" --candidate "$RUNNER_TEMP/candidate-signed.apk" --output-dir "$GITHUB_WORKSPACE/runtime-results"

      - name: Upload runtime evidence (no APKs or signing keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Sternfenster-0.2.1-API35-runtime-evidence
          path: runtime-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Remove disposable signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/runtime-test.p12"
