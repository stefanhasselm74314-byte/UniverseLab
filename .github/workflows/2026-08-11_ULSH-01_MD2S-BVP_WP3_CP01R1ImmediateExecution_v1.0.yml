name: ULSH-01 WP3 CP01R1 immediate physical execution

on:
  push:
    branches: [main]
    paths:
      - registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_CP01R1ImmediateExecutionTrigger_v1.0.json

permissions:
  contents: read

concurrency:
  group: ulsh-01-cp01r1-first-physical-transaction
  cancel-in-progress: false

jobs:
  cp01r1:
    name: exact-h3-single-use-cp01r1
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONHASHSEED: '0'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
      VECLIB_MAXIMUM_THREADS: '1'
      PIP_NO_INPUT: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Refuse workflow rerun before any issuance
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1" || { echo "This trigger authorizes exactly one first-attempt transaction; reruns are forbidden." >&2; exit 79; }

      - name: Checkout exact triggering main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up frozen Python major-minor
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile issuer and exact H3 transaction
        run: |
          python -m py_compile \
            tools/2026-08-11_ulsh_01_md2s_bvp_wp3_cp01r1_issue_and_execute_v1.0.py \
            tools/2026-08-11_ulsh_01_md2s_bvp_wp2_transaction_v1.4.py

      - name: Install exact frozen numerical dependencies
        run: |
          python -m pip install --no-input --disable-pip-version-check \
            -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt

      - name: Fresh recheck and issue exact H3 release plus single-use grant
        run: |
          set -Eeuo pipefail
          python tools/2026-08-11_ulsh_01_md2s_bvp_wp3_cp01r1_issue_and_execute_v1.0.py \
            --summary "${RUNNER_TEMP}/cp01r1-issuance-summary.json"

      - name: Spend grant once and start frozen 7x5 CP01R1 transaction
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/ulsh01-cp01r1"
          python tools/2026-08-11_ulsh_01_md2s_bvp_wp2_transaction_v1.4.py execute \
            --transaction-root "${RUNNER_TEMP}/ulsh01-cp01r1" \
            2>&1 | tee "${RUNNER_TEMP}/cp01r1-execution.log"

      - name: Preserve issuance, grant ledger and immutable result package
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ULSH-01-CP01R1-physical-transaction-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          retention-days: 90
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/cp01r1-issuance-summary.json
            ${{ runner.temp }}/cp01r1-execution.log
            ${{ runner.temp }}/ulsh01-cp01r1/**
            registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_PhysicalSolveReleaseAuthorization_v1.3.json
            registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.3.json
