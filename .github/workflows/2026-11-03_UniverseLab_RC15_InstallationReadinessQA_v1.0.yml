name: UniverseLab RC15 live installation-readiness HOLD audit
on:
  pull_request:
    paths:
      - 'drafts/2026-11-03_UniverseLab_RC15_InstallationReadinessEvidence_v1.0_DRAFT.json'
      - 'governance/2026-11-03_UniverseLab_RC15_InstallationReadinessRunbook_v1.0.md'
      - 'tests/2026-11-03_test_UniverseLab_RC15_InstallationReadiness_v1.0.py'
      - '.github/workflows/2026-11-03_UniverseLab_RC15_InstallationReadinessQA_v1.0.yml'
permissions:
  contents: read
  checks: read
  pull-requests: read
jobs:
  rc15-readiness-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Compile installation readiness audit
        run: python3 -m py_compile tests/2026-11-03_test_UniverseLab_RC15_InstallationReadiness_v1.0.py
      - name: Recheck live main, ruleset, Draft PRs and check-run attribution
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 tests/2026-11-03_test_UniverseLab_RC15_InstallationReadiness_v1.0.py --live
      - name: Confirm no active mutations
        run: |
          git diff --quiet
          git diff --cached --quiet
      - name: Preserve release hold
        run: |
          echo 'RC15 AUDIT PASS does NOT mean guard installation is ready.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Expected: uninstalled guard, no required-main rule, owner approval and canary tests outstanding.' >> "$GITHUB_STEP_SUMMARY"
          echo 'CANONICAL_PROMOTION=BLOCKED; PHYSICAL_GATE_EFFECT=NONE.' >> "$GITHUB_STEP_SUMMARY"
