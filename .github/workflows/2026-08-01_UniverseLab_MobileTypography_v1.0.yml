name: UniverseLab mobile typography contract

on:
  pull_request:
    branches:
      - main
    paths:
      - "assets/2026-08-01_UniverseLab_MobileTypography_v1.0.css"
      - "tools/2026-08-01_apply_mobile_typography_v1.0.py"
      - "tests/2026-08-01_test_mobile_typography_v1.0.py"
      - ".github/workflows/2026-08-01_UniverseLab_MobileTypography_v1.0.yml"
      - "index.html"
      - "observatory.html"
      - "journey.html"
      - "compare-safe.html"
      - "hyperlab.html"
      - "universe3d.html"
      - "validation.html"
      - "guide.html"
      - "research-status.html"
      - "emergence.html"
  push:
    branches:
      - main
    paths:
      - "assets/2026-08-01_UniverseLab_MobileTypography_v1.0.css"
      - "tools/2026-08-01_apply_mobile_typography_v1.0.py"
      - "tests/2026-08-01_test_mobile_typography_v1.0.py"
      - ".github/workflows/2026-08-01_UniverseLab_MobileTypography_v1.0.yml"
      - "index.html"
      - "observatory.html"
      - "journey.html"
      - "compare-safe.html"
      - "hyperlab.html"
      - "universe3d.html"
      - "validation.html"
      - "guide.html"
      - "research-status.html"
      - "emergence.html"

permissions:
  contents: read

jobs:
  validate-mobile-typography:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile contract tools
        run: |
          python -m py_compile tools/2026-08-01_apply_mobile_typography_v1.0.py
          python -m py_compile tests/2026-08-01_test_mobile_typography_v1.0.py

      - name: Run migration contract tests
        run: python tests/2026-08-01_test_mobile_typography_v1.0.py -v

      - name: Verify active page links
        run: python tools/2026-08-01_apply_mobile_typography_v1.0.py --check

      - name: Verify minimum mobile typography targets
        shell: bash
        run: |
          grep -F 'font-size: 17px !important' assets/2026-08-01_UniverseLab_MobileTypography_v1.0.css
          grep -F 'min-height: 50px !important' assets/2026-08-01_UniverseLab_MobileTypography_v1.0.css
          grep -F 'font-size: 15px !important' assets/2026-08-01_UniverseLab_MobileTypography_v1.0.css
