name: HZT-M0-S6 C-PHYS-M1 Background-3C2 audit result

on:
  pull_request:
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2IndependentBackendLedger_v0.1.md"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2_AuditResult_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2IndependentBackendLedger_v0.1.md"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2_AuditResult_v0.1.yml"

permissions:
  contents: read

jobs:
  revalidate-dual-backend-audit-result:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install frozen dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C_v0.1.txt
      - name: Validate recorded result
        run: python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json >/dev/null
      - name: Re-run audit and compare immutable measurements
        run: |
          python tools/2026-08-04_hzt_m0_s6_c_phys_m1_background_3c_dual_backend_gate_v0.1.py audit --json > /tmp/current-dual-audit.json
          python - <<'PY'
          import json
          from pathlib import Path
          recorded=json.loads(Path('registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3C2DualBackendAuditResult_v0.1.json').read_text())
          current=json.loads(Path('/tmp/current-dual-audit.json').read_text())
          assert recorded['status']==current['status']=='PASS_DUAL_BACKEND_CONTROL_AUDIT_NO_NONLINEAR_EXECUTION'
          assert recorded['run_id']==current['run_id']
          assert recorded['run_payload_sha256']==current['run_payload_sha256']
          assert recorded['primary_backend']['newton_call_count']==current['primary_newton_call_count']==0
          assert recorded['independent_backend']['integration_call_count']==current['independent_integration_call_count']==6
          assert recorded['independent_backend']['shooting_jacobian_call_count']==current['independent_shooting_jacobian_call_count']==0
          assert len(recorded['cutoff_table'])==len(current['cutoff_table'])==3
          for old,new in zip(recorded['cutoff_table'],current['cutoff_table']):
              for key in ('epsilon','profile_error_max','constraint_max','boundary_exact_distance','primary_independent_boundary_distance'):
                  assert old[key]==new[key], (key,old[key],new[key])
          assert recorded['firewall_tests']['future_grant_artifact_present'] is False
          assert recorded['firewall_tests']['target_model_solve_executed'] is False
          assert recorded['firewall_tests']['result_artifact_created'] is False
          assert recorded['gate_effect']['physical_evidence_effect']=='NONE'
          PY
      - name: Re-prove no execution artifacts
        run: |
          test ! -e registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3CExecutionAuthorization_v0.2.json
          test ! -d artifacts/hzt-m0/md2s/background3c/HZT-M0-S6-C-PHYS-M1-BG3B-CP01R1
