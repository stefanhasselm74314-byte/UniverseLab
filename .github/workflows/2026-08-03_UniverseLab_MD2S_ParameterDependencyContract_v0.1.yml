name: UniverseLab MD-2S parameter dependency contract

on:
  pull_request:
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_ParameterAngularFluxDependencyLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.3.json"
      - "registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json"
      - "registry/2026-08-03_MD2S_SymbolicDependencyGraph_v0.1.json"
      - "tools/2026-08-03_validate_md2s_parameter_dependency_v0.1.py"
      - "tests/2026-08-03_test_md2s_parameter_dependency_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_ParameterDependencyContract_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "science/hzt-m0/md2s/2026-08-03_MD2S_ParameterAngularFluxDependencyLedger_v0.1.md"
      - "science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.3.json"
      - "registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json"
      - "registry/2026-08-03_MD2S_SymbolicDependencyGraph_v0.1.json"
      - "tools/2026-08-03_validate_md2s_parameter_dependency_v0.1.py"
      - "tests/2026-08-03_test_md2s_parameter_dependency_v0.1.py"
      - ".github/workflows/2026-08-03_UniverseLab_MD2S_ParameterDependencyContract_v0.1.yml"

permissions:
  contents: read

jobs:
  validate-md2s-parameter-dependency:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate JSON artifacts
        run: |
          python -m json.tool registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-03_MD2S_SymbolicDependencyGraph_v0.1.json >/dev/null
          python -m json.tool science/hzt-m0/md2s/2026-08-03_MD2S_R1_ModelFreezeAddendum_v0.3.json >/dev/null

      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-08-03_validate_md2s_parameter_dependency_v0.1.py
          python -m py_compile tests/2026-08-03_test_md2s_parameter_dependency_v0.1.py

      - name: Run parameter and graph tests
        run: python tests/2026-08-03_test_md2s_parameter_dependency_v0.1.py -v

      - name: Enforce parameter and dependency contract
        run: python tools/2026-08-03_validate_md2s_parameter_dependency_v0.1.py >/tmp/md2s-parameter-contract.json

      - name: Verify governance firewall
        run: |
          grep -q '"MF-006": "PARTIAL_STRUCTURAL_FREEZE"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
          grep -q '"R1.1": "BLOCKED"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
          grep -q '"MD2S_SOLVER": "NOT_AUTHORIZED"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
          grep -q '"K1-D": "NOT_RELEASED"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
          grep -q '"K1-E": "NOT_ADMISSIBLE"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
          grep -q '"q_ref_equals_q_sigma": "OPEN_REQUIRES_MINIMAL_CHARGE_PROOF"' registry/2026-08-03_MD2S_ParameterAngularFluxContract_v0.1.json
