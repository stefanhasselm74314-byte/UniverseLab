name: ULSH-01 WP3-RR1 CP01R1 result review

on:
  pull_request:
    paths:
      - registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReview_v1.0.json
      - science/hzt-m0/md2s/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultLedger_v1.0.md
      - tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReviewTest_v1.0.py
      - .github/workflows/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReview_v1.0.yml
  push:
    branches: [main]
    paths:
      - registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReview_v1.0.json
      - tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReviewTest_v1.0.py

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate review JSON
        run: python -m json.tool registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReview_v1.0.json >/dev/null
      - name: Compile no-rerun review test
        run: python -m py_compile tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReviewTest_v1.0.py
      - name: Run post-execution review invariants
        run: python tests/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReviewTest_v1.0.py
      - name: Hard no-rerun firewall
        run: |
          test ! -e registry/2026-08-11_ULSH-01_MD2S-BVP_WP2_SingleUseExecutionGrant_v1.3.json
          grep -q 'DO_NOT_RERUN_CP01R1_WITH_THE_SPENT_GRANT' registry/2026-08-11_ULSH-01_MD2S-BVP_WP3_RR1_CP01R1ResultReview_v1.0.json
