name: ULSH-01 WP2 CP01R4 authorization filling checklist QA v0.1

on:
  pull_request:
    paths:
      - 'registry/2026-08-28_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionGrantFillingChecklist_v0.1.json'
      - 'registry/2026-08-28_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionGrantFillingChecklist_v0.1.md'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionSchema_v0.1.json'
      - 'registry/2026-08-27_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_SingleUseGrantSchema_v0.2.json'
      - 'registry/2026-08-28_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_ReleasePackageManifest_v0.2.json'
      - 'registry/2026-08-28_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_ReleasePackageManifest_v0.3.json'
      - 'tests/2026-08-28_test_ULSH01_WP2_CP01R4_AuthorizationFillingChecklist_v0.1.py'
      - '.github/workflows/2026-08-28_ULSH01_WP2_CP01R4_AuthorizationFillingChecklist_QA_v0.1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  authorization-filling-checklist-no-execution:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout exact QA subject
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate checklist JSON
        run: python -m json.tool registry/2026-08-28_HZT_M0_S6_C_PHYS_M1_ULSH01_WP2_AuthorizationDecisionGrantFillingChecklist_v0.1.json >/dev/null

      - name: Compile fail-closed QA
        run: python -m py_compile tests/2026-08-28_test_ULSH01_WP2_CP01R4_AuthorizationFillingChecklist_v0.1.py

      - name: Run nonoperative checklist QA
        run: |
          python tests/2026-08-28_test_ULSH01_WP2_CP01R4_AuthorizationFillingChecklist_v0.1.py \
            | tee /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json

      - name: Assert evidence-neutral blocked output
        run: |
          grep -F '"status": "PASS_NONOPERATIVE_FILLING_CHECKLIST_QA_AUTHORITY_GATE_BLOCKED_NO_EXECUTION"' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"authority_signature_provenance": "BLOCKED"' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"runtime_issuance_bindings": "BLOCKED"' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"operative_authorization_decision_created": false' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"operative_single_use_grant_created": false' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"backend_imported": false' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"solver_executed": false' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
          grep -F '"physical_evidence_effect": "NONE"' /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json

      - name: Upload nonoperative QA record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ulsh01-wp2-cp01r4-authorization-filling-checklist-v01-qa-only
          path: /tmp/ulsh01_wp2_cp01r4_authorization_filling_checklist_qa_v01.json
