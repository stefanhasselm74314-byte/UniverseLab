name: HZT-M0-S6 C-PHYS-M1 Background-3B run-input freeze

on:
  pull_request:
    paths:
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeLedger_v0.1.md"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.yml"
  push:
    branches: [main]
    paths:
      - "requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json"
      - "registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json"
      - "science/hzt-m0/md2s/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeLedger_v0.1.md"
      - "tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py"
      - "tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py"
      - ".github/workflows/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.yml"

permissions:
  contents: read

jobs:
  verify-background-3b-run-input:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout complete history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install frozen verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3B_v0.1.txt

      - name: Validate JSON artifacts
        run: |
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BSeedSpecification_v0.1.json >/dev/null
          python -m json.tool registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json >/dev/null

      - name: Compile validator and tests
        run: |
          python -m py_compile tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py
          python -m py_compile tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py

      - name: Recompute hashes and exact control-seed identities
        run: python tools/2026-08-04_validate_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py --json

      - name: Run fail-closed negative regression tests
        run: python tests/2026-08-04_test_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py

      - name: Enforce no-solver and evidence firewall
        shell: bash
        run: |
          set -euo pipefail
          FILE=registry/2026-08-04_HZT_M0_S6_C_PHYS_M1_Background3BRunInputFreezeContract_v0.1.json
          grep -q '"classification": "EXACT_RUN_INPUT_FREEZE_NO_SOLVER_EXECUTION"' "$FILE"
          grep -q '"status": "RUN_INPUT_FROZEN_EXECUTION_NOT_AUTHORIZED"' "$FILE"
          grep -q '"solver_authorized": false' "$FILE"
          grep -q '"solver_implementation_commit": "NOT_PRESENT_EXECUTION_FORBIDDEN"' "$FILE"
          grep -q '"solver_entry_point": "NOT_PRESENT"' "$FILE"
          grep -q '"current_execution": "NOT_EXECUTED"' "$FILE"
          grep -q '"solver_implementation_present": false' "$FILE"
          grep -q '"solver_initialization": false' "$FILE"
          grep -q '"nonlinear_solver_run": false' "$FILE"
          grep -q '"parameter_scan": false' "$FILE"
          grep -q '"topology_scan": false' "$FILE"
          grep -q '"background_candidate_created": false' "$FILE"
          grep -q '"physical_background": "NOT_ESTABLISHED"' "$FILE"
          grep -q '"R1.1": "BLOCKED"' "$FILE"
          grep -q '"R1.2": "BLOCKED"' "$FILE"
          grep -q '"official_MD2S_solver": "NOT_AUTHORIZED"' "$FILE"
          grep -q '"K1-D": "NOT_RELEASED"' "$FILE"
          grep -q '"K1-E": "NOT_ADMISSIBLE"' "$FILE"
          grep -q '"physical_evidence_effect": "NONE"' "$FILE"
          test ! -e tools/2026-08-04_run_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py
          test ! -e tools/2026-08-04_solve_hzt_m0_s6_c_phys_m1_background_3b_v0.1.py
