name: UniverseLab ULSH-05 WP1D2 Kinematic Invariant Projector Solvability QA v0.1

on:
  pull_request:
    paths:
      - 'registry/2026-09-14_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.json'
      - 'science/solver-hub/2026-09-14_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.md'
      - 'tests/2026-09-14_test_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.py'
      - 'tools/2026-09-14_prepare_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.py'
      - '.github/workflows/2026-09-14_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_QA_v0.1.yml'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1D1_GaugeOperatorKernelPreflight_v0.1.json'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1D_ConditionalSVTGaugeConstraintReduction_v0.1.json'
      - 'registry/2026-09-08_UniverseLab_ULSH05_WP1C4B2C_GlobalBoundaryDomainPreflight_v0.1.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wp1d2-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout exact head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run standalone WP1D2 controls
        run: python tests/2026-09-14_test_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.py

      - name: Emit nonoperative status summary
        run: |
          python tools/2026-09-14_prepare_UniverseLab_ULSH05_WP1D2_KinematicInvariantProjectorSolvabilityPreflight_v0.1.py --output /tmp/wp1d2-summary.json
          cat /tmp/wp1d2-summary.json

      - name: Fail closed on physical and solver gates
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('/tmp/wp1d2-summary.json')
          s = json.loads(p.read_text(encoding='utf-8'))
          f = s['physical_firewalls']
          e = s['effects']

          expected = {
              'WP1_physical_boundary_domain': 'BLOCKED_UNESTABLISHED_BACKGROUND_AND_GLOBAL_CORNER_DATA',
              'WP1D_constraint_elimination': 'BLOCKED_BY_ULSH04_AND_UNFROZEN_PHYSICAL_TIME_SLICING',
              'WP1D_physical_3plus1_SVT': 'NOT_RELEASED',
              'WP1D_physical_DOF_count': 'NOT_RELEASED',
              'PHYSICAL_BACKGROUND': 'NOT_ESTABLISHED',
              'FM-G0': 'OPEN',
              'K1-D': 'NOT_RELEASED',
              'K1-E': 'NOT_ADMISSIBLE',
              'BACKEND_IMPORT': 'NOT_EXECUTED',
              'SOLVER_EXECUTION': 'NOT_EXECUTED',
              'PHYSICAL_RESPONSE_RANK': 'NOT_EXECUTED',
          }
          assert f == expected, (f, expected)
          assert e == {
              'physical_gate_effect': 'NONE',
              'physical_evidence_effect': 'NONE',
              'solver_authorized': False,
          }
          assert s['next_exact_id'] == 'NOT_ASSIGNED_BY_THIS_PREFLIGHT'
          print('PASS fail-closed physical/solver firewall')
          PY
