name: UniverseLab RC18 complete main-tree Draft exposure audit
on:
  pull_request:
    paths:
      - 'tools/2026-11-03_UniverseLab_RC18_DraftExposureAudit_v1.0.py'
      - 'tests/2026-11-03_test_UniverseLab_RC18_DraftExposureAudit_v1.0.py'
      - 'drafts/2026-11-03_UniverseLab_RC18_ExposureFindings_v1.0_DRAFT.json'
      - 'governance/2026-11-03_UniverseLab_RC18_DraftPublicationDataflowReview_v1.0.md'
      - '.github/workflows/2026-11-03_UniverseLab_RC18_DraftExposureAuditQA_v1.0.yml'
permissions:
  contents: read
jobs:
  rc18-whole-tree:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Compile exact-tree scanner and tests
        run: |
          python3 -m py_compile tools/2026-11-03_UniverseLab_RC18_DraftExposureAudit_v1.0.py
          python3 -m py_compile tests/2026-11-03_test_UniverseLab_RC18_DraftExposureAudit_v1.0.py
      - name: Check 13 adversarial scanner scenarios
        run: python3 tests/2026-11-03_test_UniverseLab_RC18_DraftExposureAudit_v1.0.py -v
      - name: Scan every pinned main Git blob read-only
        run: python3 tools/2026-11-03_UniverseLab_RC18_DraftExposureAudit_v1.0.py --real
      - name: Confirm no source mutation
        run: |
          git diff --quiet
          git diff --cached --quiet
      - name: Preserve publication HOLD
        run: |
          echo 'RC18: pinned full-tree lexical scan completed. GitHub Pages uploads repository root.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Drafts may be exposed by Pages after merge; the repository itself is public.' >> "$GITHUB_STEP_SUMMARY"
          echo 'ROUTINE_AUTOMERGE=BLOCKED; NO RELEASE, CANON, OR SCIENTIFIC PROMOTION.' >> "$GITHUB_STEP_SUMMARY"
