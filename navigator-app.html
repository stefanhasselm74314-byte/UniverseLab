<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#071018"><title>UniverseLab · Wissenschafts-Navigator</title><style>html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#071018;color:#eef8ff;font:14px system-ui,-apple-system,"Segoe UI",sans-serif}iframe{display:block;width:100%;height:100%;border:0;background:#071018}main{height:100%;display:grid;place-items:center;text-align:center;padding:18px}a{color:#8bdcff}</style></head><body><main id="fallback"><div><h1>UniverseLab Navigator</h1><p>Navigator wird geladen …</p><p><a href="./navigator.html?v=1">Direkt öffnen</a></p></div></main><script>(()=>{'use strict';const frame=document.createElement('iframe');frame.title='UniverseLab Wissenschafts-Navigator';frame.src='./navigator.html?v=2';frame.onload=()=>{try{const d=frame.contentDocument;if(!d)return;const nav=d.querySelector('nav');if(nav&&!d.querySelector('[data-ul-source]')){const a=d.createElement('a');a.href='./source.html?v=1';a.textContent='Quellcode';a.title='UniverseLab Quellcode- und Entwicklerhub';a.dataset.ulSource='1';nav.appendChild(a)}const dev=d.getElementById('entwickler');if(dev&&!d.querySelector('[data-ul-source-card]')){const grid=dev.querySelector('.grid');if(grid){const article=d.createElement('article');article.className='card wide';article.dataset.ulSourceCard='1';article.innerHTML='<span class="tag diag">QUELLCODE</span><h3>UniverseLab Entwicklerhub</h3><p>HTML, CSS, JavaScript, JSON, Live-Seiten und bearbeitbare GitHub-Dateien zentral gebündelt.</p><div class="links"><a class="dev" href="./source.html?v=1"><span>Quellcode-Hub öffnen</span><span>→</span></a></div>';grid.prepend(article)}}d.querySelectorAll('a').forEach(a=>{const href=a.getAttribute('href')||'';a.setAttribute('target',href.startsWith('http')?'_blank':'_top')});document.getElementById('fallback')?.remove()}catch(e){console.warn('Navigator enhancement failed',e)}};document.body.appendChild(frame)})();</script></body></html>
